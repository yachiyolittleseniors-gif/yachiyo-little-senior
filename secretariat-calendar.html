<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>事務局カレンダー | 八千代リトルシニア</title>
<style>
:root{--navy:#071a35;--gold:#c9a24b;--cream:#f7f2e7;--line:#e7dfcf}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.head{background:var(--navy);color:#fff;padding:18px 16px;border-bottom:3px solid var(--gold)}.head b{font-size:20px}.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}.back{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border:1px solid var(--gold);border-radius:10px;background:#fff;color:var(--navy);font-weight:800;text-decoration:none}.card{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 24px #071a3510}.title{text-align:center;font-size:20px;font-weight:900;color:var(--navy);margin:0 0 12px}.toolbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}.month{text-align:center;font-weight:900;font-size:18px}.nav{height:40px;border:1px solid var(--gold);border-radius:10px;background:#fff;color:var(--navy);font-size:25px}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.week{margin-top:14px;border-bottom:1px solid var(--line);font-size:12px;font-weight:800;text-align:center;padding-bottom:7px}.week span:first-child{color:#c62828}.week span:last-child{color:#1769aa}.day{min-height:88px;padding:5px;border-right:1px solid #eee;border-bottom:1px solid #eee;background:#fff;overflow:hidden}.day:nth-child(7n){border-right:0}.day.muted{background:#fafafa;color:#aaa}.num{font-size:12px;font-weight:800}.sun .num{color:#c62828}.sat .num{color:#1769aa}.event{display:block;width:100%;margin-top:4px;padding:4px 5px;border:0;border-radius:6px;background:#f5edd8;color:#3b2e12;text-align:left;font-size:10px;font-weight:700;line-height:1.3}.empty,.error{text-align:center;padding:28px 8px;color:#687083}.note{font-size:12px;color:#687083;text-align:center;margin:12px 0 0}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.box{width:min(520px,100%);max-height:80vh;overflow:auto;background:#fff;border-radius:16px;padding:18px}.box h2{margin:0 0 12px;color:var(--navy)}.item{padding:12px 0;border-top:1px solid #eee}.item:first-of-type{border-top:0}.meta{font-size:13px;line-height:1.7}.close{width:100%;margin-top:12px;padding:11px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:800}@media(max-width:520px){.day{min-height:72px;padding:3px}.event{font-size:9px;padding:3px}.card{padding:12px}.wrap{padding-left:8px;padding-right:8px}}
</style></head><body><header class="head"><b>八千代リトルシニア</b></header><main class="wrap"><a id="back" class="back" href="./board.html">← 出欠確認へ戻る</a><section class="card"><h1 class="title">📅 事務局カレンダー</h1><div class="toolbar"><button id="prev" class="nav" type="button">‹</button><div id="month" class="month"></div><button id="next" class="nav" type="button">›</button></div><div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="grid" class="grid"></div><p class="note">閲覧専用です。予定の入力・編集・削除はできません。</p></section></main><div id="modal" class="modal"><div class="box"><h2 id="dateTitle"></h2><div id="details"></div><button id="close" class="close" type="button">閉じる</button></div></div>
<script>
(()=>{const API='/.netlify/functions/site-data?section=board-meeting-schedule';const q=new URLSearchParams(location.search),from=q.get('from')||'';const pages={attendance:['./attendance.html','保護者出欠確認へ戻る'],player:['./player-attendance.html','選手出欠確認へ戻る'],coach:['./coach-attendance.html','指導者出欠確認へ戻る']};const dest=pages[from]||['./board.html','チーム専用ページへ戻る'];back.href=dest[0];back.textContent='← '+dest[1];let d=new Date(),year=d.getFullYear(),month=d.getMonth(),events=[];
function headers(){const h={};const a=sessionStorage.getItem('yachiyoAttendancePass')||'';const c=sessionStorage.getItem('yachiyoCoachAttendancePass')||'';if(a)h['x-access-password']=a;if(c)h['x-coach-password']=c;return h}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function key(y,m,day){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0')}
function render(){document.getElementById('month').textContent=year+'年 '+(month+1)+'月';const g=document.getElementById('grid');g.innerHTML='';const first=new Date(year,month,1),start=new Date(year,month,1-first.getDay());for(let i=0;i<42;i++){const x=new Date(start);x.setDate(start.getDate()+i);const k=key(x.getFullYear(),x.getMonth(),x.getDate()),cell=document.createElement('div');cell.className='day '+(x.getMonth()!==month?'muted ':'')+(x.getDay()===0?'sun':x.getDay()===6?'sat':'');cell.innerHTML='<div class="num">'+x.getDate()+'</div>';events.filter(e=>e.date===k).forEach(e=>{const b=document.createElement('button');b.className='event';b.type='button';b.textContent=(e.time?e.time+' ':'')+(e.title||'予定');b.onclick=()=>openDay(k);cell.appendChild(b)});g.appendChild(cell)}}
function openDay(k){const list=events.filter(e=>e.date===k);document.getElementById('dateTitle').textContent=k.replace(/^(\d{4})-(\d{2})-(\d{2})$/,'$1年$2月$3日');document.getElementById('details').innerHTML=list.map(e=>'<div class="item"><b>'+esc(e.title||'予定')+'</b><div class="meta">'+(e.time?'時間：'+esc(e.time)+'<br>':'')+(e.place?'場所：'+esc(e.place)+'<br>':'')+(e.memo?'備考：'+esc(e.memo).replace(/\n/g,'<br>'):'')+'</div></div>').join('')||'<div class="empty">予定はありません。</div>';modal.classList.add('show')}
prev.onclick=()=>{month--;if(month<0){month=11;year--}render()};next.onclick=()=>{month++;if(month>11){month=0;year++}render()};close.onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};
fetch(API,{cache:'no-store',headers:headers()}).then(async r=>{if(!r.ok)throw new Error();return r.json()}).then(j=>{events=Array.isArray(j.data)?j.data:[];render()}).catch(()=>{document.getElementById('grid').innerHTML='<div class="error" style="grid-column:1/-1">カレンダーを読み込めませんでした。出欠確認ページから開き直してください。</div>'});render()})();
</script></body></html>
