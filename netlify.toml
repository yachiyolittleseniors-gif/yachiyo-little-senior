# TEAM CORE UI preview ONLY. Do not merge this branch into main.
# Only the isolated sample app is published; no production pages or Functions.
[build]
  base = "teamcore-preview"
  command = "node build.mjs"
  publish = "public"
  functions = "empty-functions"

[build.environment]
  NODE_VERSION = "22"

[build.processing]
  skip_processing = true
