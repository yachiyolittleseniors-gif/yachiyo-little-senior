[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 公開ページの正規URLは拡張子なしに統一する。
# 旧URLや既存の検索結果からの評価は301で正規URLへ引き継ぐ。
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

