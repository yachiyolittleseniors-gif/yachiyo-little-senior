s:flex-start;justify-content:space-between;gap:10px}.preview-title{margin:0;font-family:serif;font-size:clamp(16px,4.5vw,25px);font-weight:500;line-height:1.25;white-space:nowrap}.grade-badge{flex:none;min-width:70px;padding:8px;border:2px solid #72c590;border-radius:8px;background:#eaf8ef;color:#185f37;text-align:center;font-weight:800}.preview-meta,.preview-venue{margin-top:6px;color:#dfe5ec;font-size:12px;line-height:1.5}.preview-venue b{color:#d8ad4c}.preview-counts{display:grid;grid-template-columns:repeat(6,1fr);background:#f8f5ed;border-bottom:1px solid var(--line)}.preview-count{padding:9px 4px;text-align:center;border-right:1px solid #ded7c8}.preview-count:last-child{border:0}.preview-count small,.preview-count strong{display:block}.preview-count small{color:var(--muted);font-size:10px}.preview-count strong{margin-top:2px;color:var(--navy);font-size:13px}.preview-groups{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:12px;background:#f4f3ef}.preview-group{align-self:start;border:1px solid #cfd5dc;background:#fff}.preview-group h3{margin:0;padding:7px 9px;border-left:5px solid var(--gold);background:var(--navy);color:#fff;font-size:13px}.preview-car{display:grid;grid-template-columns:55px 1fr;gap:7px;padding:8px;border-top:1px solid var(--line)}.preview-car:first-of-type{border-top:0}.preview-car-label{align-self:start;padding:5px 3px;border-radius:4px;background:#eef1f4;color:var(--navy);text-align:center;font-size:11px;font-weight:800}.preview-detail{display:grid;gap:3px;font-size:11px;line-height:1.45}.preview-detail span{padding:4px 6px;border-left:3px solid #a9b8c8;background:#f5f8fb}.preview-detail span:first-child{border-left-color:var(--gold);background:#fff8e8;color:#5f4717;font-weight:800}.preview-detail span:last-child{border-left-color:#d88aa6;background:#fff3f7}.preview-note{padding:9px 12px;border-top:1px solid var(--line);background:#fff9e8;color:#665831;font-size:11px;line-height:1.55}.empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}@media(max-width:700px){.page{padding:14px 8px 36px}.title{font-size:25px}.topline{align-items:flex-start}.overview{grid-template-columns:1fr}.counts{order:-1}.auto-btn{min-height:50px;font-size:14px}.fields{grid-template-columns:1fr 1fr}.field.wide{grid-column:1/-1}.coach-box{grid-template-columns:1fr 1fr}.coach-box .field:last-child{grid-column:1/-1}.candidate-list{grid-template-columns:1fr 1fr}.car-edit{grid-template-columns:58px 1fr 1fr}.car-no{grid-row:span 2}.car-field.parents{grid-column:2/-1}.remove-car{grid-column:3}.preview-counts{grid-template-columns:repeat(3,1fr)}.preview-count:nth-child(-n+3){border-bottom:1px solid var(--line)}.preview-groups{grid-template-columns:1fr}}@media(max-width:390px){.grade-btn{font-size:12px}.candidate-list{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.field.wide{grid-column:auto}.coach-box{grid-template-columns:1fr}.coach-box .field:last-child{grid-column:auto}.bottom-actions{grid-template-columns:1fr}.car-edit{grid-template-columns:54px 1fr}.car-field.parents,.remove-car{grid-column:2}.preview-title{font-size:16px}.preview-head{padding:12px 10px}}
/* 対象学年は3・2・1年生の3択 */
.grade-buttons{grid-template-columns:repeat(3,1fr)}
.schedule-source{display:grid;gap:4px;margin:12px 0 0;padding:10px 12px;border:1px solid #d6c38f;background:#fff9e9;color:#62583f;font-size:12px;line-height:1.55}.schedule-source b{color:var(--navy)}
.field input::placeholder{color:#bd2d36;opacity:1}.field select:required:invalid{color:#bd2d36}.field select option{color:var(--ink)}
.coach-box{grid-template-columns:repeat(4,1fr)}.coach-check{display:grid;gap:5px;color:#bd2d36;font-size:12px;font-weight:700}.coach-check span:not(:first-child){display:flex;align-items:center;gap:8px;min-height:42px;padding:8px 10px;border:1px solid #cfd5dc;border-radius:6px;background:#fff}.coach-check input{width:19px;height:19px;margin:0;accent-color:var(--navy)}.coach-check:has(input:checked){color:var(--ink)}@media(max-width:700px){.coach-box{grid-template-columns:1fr 1fr}}
.all-comments{margin-top:20px;padding:14px;border:1px solid var(--line);background:#fff}.all-comments h2{margin:0 0 10px;color:var(--navy);font-size:17px}.all-comment-list{display:grid;gap:7px}.all-comment{display:grid;grid-template-columns:48px minmax(90px,140px) 1fr;gap:9px;align-items:start;padding:10px;border-left:4px solid var(--gold);background:#faf8f1;font-size:12px;line-height:1.55}.all-comment-grade{font-weight:800;color:#765718}.all-comment-name{font-weight:800;color:var(--navy)}.all-comment-text{white-space:pre-wrap}@media(max-width:520px){.all-comment{grid-template-columns:42px 1fr}.all-comment-text{grid-column:1/-1}}

<body>
<main class="page" id="carPage" hidden>
  <div class="topline"><a class="back" href="./attendance.html">← 保護者出欠確認へ戻る</a><h1 class="title">配車を組む</h1></div>
  <div class="view-tabs" role="tablist" aria-label="表示切替">
    <button class="view-tab active" id="editTab" type="button" role="tab" aria-selected="true">✎ 入力・編集</button>
    <button class="view-tab" id="previewTab" type="button" role="tab" aria-selected="false">▣ 画像プレビュー</button>
  </div>
  <div class="error" id="errorBox" role="alert"></div>
  <div class="loading" id="loading">出欠データを読み込んでいます…</div>
  <section id="editView" hidden>
    <div class="overview">
      <div class="auto-box">
        <button class="auto-btn" id="autoCreate" type="button">🪄 出席・コメントから配車案を作成</button>
        <p class="auto-help">選択した日付・学年の出席者を反映し、父の運転を優先します。母は不足時の運転または応援車へ配置します。</p>
      </div>
      <div class="counts" aria-label="配車対象人数">
        <div class="count-row"><span>選手人数</span><strong id="playerCount">0名</strong></div>
        <div class="count-row"><span>1年生帯同</span><strong id="escortCount">0名</strong></div>
        <div class="count-row"><span>保護者人数</span><strong id="parentCount">0名</strong></div>
        <div class="count-row total"><span>合計</span><strong id="totalCount">0名</strong></div>
      </div>
    </div>

    <section class="grade-box" aria-label="対象学年">
      <h2>対象学年を選択</h2>
      <div class="grade-buttons">
        <button class="grade-btn" data-grade="3" type="button">🔵 3年生</button>
        <button class="grade-btn" data-grade="2" type="button">🟢 2年生</button>
        <button class="grade-btn" data-grade="1" type="button">🔴 1年生</button>
      </div>
    </section>

    <section class="setup" aria-label="配車条件">
      <div class="fields">
        <label class="field">日付<select id="eventDate" required></select></label>
        <label class="field">試合区分<select id="gameType" required><option value="" selected disabled>選択</option><option value="official">公式戦</option><option value="practice">練習試合</option><option value="opening">開会式</option><option value="closing">閉会式</option></select></label>
        <label class="field">移動経路<select id="route" required><option value="" selected disabled>選択</option><option value="local">下道</option><option value="highway">高速</option></select></label>
        <label class="field">対戦相手<input id="opponent" maxlength="100" placeholder="入力"></label>
        <label class="field wide">場所<input id="venue" maxlength="180" placeholder="入力"></label>
        <label class="field">配車数<input id="carCount" type="number" min="1" max="40" placeholder="入力"></label>
        <label class="field">選手人数（修正可）<input id="playerCountInput" type="number" min="0" max="100" placeholder="入力"></label>
        <label class="field">1年生帯同<input id="firstGradeEscort" type="number" min="0" max="60" placeholder="入力"></label>
        <label class="field">道具車<select id="equipmentCount" required><option value="" selected disabled>選択</option><option value="no">なし</option><option value="yes">あり</option></select></label>
        <label class="field">荷物車<select id="cargoCount" required><option value="" selected disabled>選択</option><option value="no">なし</option><option value="yes">あり</option></select></label>
        <label class="field">バス<select id="bus" required><option value="" selected disabled>選択</option><option value="no">なし</option><option value="yes">あり</option></select></label>
        <label class="field">バス乗車人数<input id="busPassengers" type="number" min="0" max="100" placeholder="入力"></label>
        <label class="field">審判号<select id="umpireCar" required><option value="" selected disabled>選択</option><option value="no">なし</option><option value="yes">あり</option></select></label>
        <label class="field">指導者号<select id="coachCar" required><option value="" selected disabled>選択</option><option value="no">なし</option><option value="yes">あり</option></select></label>
      </div>
      <div class="schedule-source" id="scheduleSource" hidden><b id="scheduleSourceTitle"></b><span id="scheduleSourceDetail"></span></div>
      <div class="coach-box">
        <label class="field">指導者号の運転手<input id="coachDriver" placeholder="入力"></label>
        <label class="field">車種<input id="coachVehicle" placeholder="入力"></label>
        <label class="coach-check"><span>監督</span><span><input id="coachManager" type="checkbox">同乗する</span><span><input id="coachManagerDriver" type="checkbox">監督が運転</span></label>
        <label class="field">コーチ人数<select id="coachCount" required><option value="" selected disabled>選択</option><option value="0">0名</option><option value="1">1名</option><option value="2">2名</option><option value="3">3名</option><option value="4">4名</option><option value="5">5名</option></select></label>
      </div>
      <p class="rule">ナビは夫婦で出席していれば配偶者を優先し、いなければ出席している父を配置します。ナビは各号車から削除できます。道具車・荷物車は基本的に選手を乗せない配車にします。</p>
    </section>

    <section class="candidates" aria-label="コメントから抽出した配車候補">
      <div class="candidate-head"><strong>コメントから見つかった配車候補</strong><span id="candidateTotal">0名</span></div>
      <div class="candidate-list" id="candidateList"><div class="empty">該当するコメントはありません。</div></div>
    </section>

    <div class="cars-head"><h2>配車案</h2><button class="secondary" id="addCar" type="button">＋ 手入力で号車を追加</button></div>
    <div class="car-list" id="carList"><div class="empty">上の「配車案を作成」を押してください。</div></div>
    <div class="bottom-actions"><button class="save-btn" id="saveAssignment" type="button">配車を保存</button><button class="image-btn" id="showPreview" type="button">画像プレビューを表示</button></div>
    <div class="status" id="status" aria-live="polite"></div>
    <section class="all-comments" aria-label="選択日のコメント一覧">
      <h2 id="allCommentsTitle">その日のコメント一覧</h2>
      <div class="all-comment-list" id="allCommentList"><div class="empty">日付を選択してください。</div></div>
    </section>
  </section>

  <section id="previewView" hidden>
    <div id="previewSheet" class="preview-sheet"></div>
    <div class="bottom-actions"><button class="secondary" id="backToEdit" type="button">入力・編集へ戻る</button><button class="save-btn" id="saveImage" type="button">画像で保存</button></div>
    <div class="status" id="imageStatus" aria-live="polite"></div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" referrerpolicy="no-referrer"></script>
<script>
const PARENT_API='/.netlify/functions/attendance-data';
const PLAYER_API='/.netlify/functions/player-attendance-data';
const ASSIGNMENT_API='/.netlify/functions/car-assignment-data';
const SCHEDULE_API='/.netlify/functions/site-data?section=schedule';
const ACCESS_KEY='yachiyoAttendancePass';
const DRAFT_ADMIN_KEY='yachiyoAttendanceDraftAdminPass';
const $=selector=>document.querySelector(selector);
const $$=selector=>[...document.querySelectorAll(selector)];
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const typeLabels={coach:'指導者号',player:'選手号',equipment:'道具車',cargo:'荷物車',support:'応援車',umpire:'審判号'};
let accessPass='',draftAdminPass='',parentData={events:[],members:[],answers:{},comments:[]},playerData={events:[],members:[],answers:{},comments:[]},scheduleEvents=[],savedAssignments={},selectedGrade='',cars=[];

function showError(message=''){const box=$('#errorBox');box.textContent=message;box.classList.toggle('show',!!message)}
function readAccessPass(){try{return sessionStorage.getItem(ACCESS_KEY)||''}catch{return''}}
async function api(url,options={},admin=false){const headers={'content-type':'application/json','x-access-password':accessPass,...(options.headers||{})};if(admin)headers['x-admin-password']=draftAdminPass;const response=await fetch(url,{cache:'no-store',...options,headers});let body={};try{body=await response.json()}catch{}if(!response.ok)throw new Error(body.error||'通信に失敗しました');return body}
function normalize(data){return{events:Array.isArray(data?.events)?data.events:[],members:Array.isArray(data?.members)?data.members:[],answers:data?.answers&&typeof data.answers==='object'?data.answers:{},comments:Array.isArray(data?.comments)?data.comments:[]}}
function memberGrade(member){return String((Array.isArray(member?.grades)?member.grades[0]:member?.grade)||'')}
function parentType(member){if(member?.parent==='father'||String(member?.name||'').endsWith('父'))return'father';if(member?.parent==='mother'||String(member?.name||'').endsWith('母'))return'mother';return''}
function gradeMatches(member){return selectedGrade==='all'||memberGrade(member)===selectedGrade}
function eventFor(data,date){return data.events.find(event=>String(event.date)===date)||{id:'schedule_'+String(date).replaceAll('-',''),date}}
function isAttending(data,member,date){const event=eventFor(data,date);return !!event&&data.answers?.[member.id]?.[event.id]==='○'}
function formatDate(value){if(!value)return'';const date=new Date(value+'T00:00:00');return `${date.getMonth()+1}月${date.getDate()}日（${['日','月','火','水','木','金','土'][date.getDay()]}）`}
function currentDate(){return $('#eventDate').value}
function numberValue(selector){return Math.max(0,Number($(selector).value)||0)}
function attendeeSnapshot(){const date=currentDate();const players=playerData.members.filter(member=>gradeMatches(member)&&isAttending(playerData,member,date));const parents=parentData.members.filter(member=>gradeMatches(member)&&isAttending(parentData,member,date));const playerCount=$('#playerCountInput').value===''?players.length:numberValue('#playerCountInput');const escort=numberValue('#firstGradeEscort');return{date,players,playerCount,parents,escort,total:playerCount+parents.length+escort}}
function updateCounts(){const info=attendeeSnapshot();$('#playerCount').textContent=info.playerCount+'名';$('#escortCount').textContent=info.escort+'名';$('#parentCount').textContent=info.parents.length+'名';$('#totalCount').textContent=info.total+'名'}
function withinAttendanceRange(event){const now=new Date(),start=new Date(now),end=new Date(now);start.setDate(start.getDate()-((start.getDay()+6)%7));start.setHours(0,0,0,0);end.setMonth(end.getMonth()+1);const date=new Date(String(event?.date||'')+'T00:00:00');return !Number.isNaN(date.getTime())&&date>=start&&date<=end}
function allEventDates(){return [...new Set([...parentData.events,...scheduleEvents].filter(withinAttendanceRange).map(event=>String(event.date||'')).filter(date=>/^\d{4}-\d{2}-\d{2}$/.test(date)))].sort()}
function scheduleForDate(date){return scheduleEvents.find(event=>String(event?.date||'')===date)||null}
function scheduleGameType(event){const text=`${event?.title||''} ${event?.memo||''}`;if(/開会式/.test(text))return'opening';if(/閉会式/.test(text))return'closing';if(event?.category==='friendly'||/練習試合/.test(text))return'practice';if(event?.category==='official'||/公式戦/.test(text))return'official';return''}
function scheduleOpponent(event){const title=String(event?.title||'').trim(),memo=String(event?.memo||'').trim(),text=`${title}\n${memo}`;const labeled=text.match(/(?:対戦相手|対戦)\s*[:：]\s*([^\n、,｜|]+)/);if(labeled)return labeled[1].trim();const versus=text.match(/(?:vs\.?|VS\.?)\s*([^\s、,｜|]+)/);if(versus)return versus[1].trim();const teamLine=text.split(/\n|[、,｜|]/).map(value=>value.trim()).find(value=>/(?:シニア|ボーイズ|ヤング|ポニー|クラブ|中学校|高校)/.test(value));if(teamLine)return teamLine.replace(/^(?:練習試合|公式戦)\s*[:：]?\s*/,'').trim();if(event?.category==='friendly'&&!/^(?:練習試合|試合|遠征)$/.test(title))return title;return''}
function renderScheduleSource(event){const box=$('#scheduleSource');if(!event){box.hidden=true;return}const details=[event.time&&`時間：${event.time}`,event.place&&`場所：${event.place}`,event.memo&&`詳細：${event.memo}`].filter(Boolean);$('#scheduleSourceTitle').textContent=`スケジュール：${event.title||'予定'}`;$('#scheduleSourceDetail').textContent=details.join('｜');box.hidden=false}
function applyScheduleDefaults(){const event=scheduleForDate(currentDate());renderScheduleSource(event);if(!event)return;const gameType=scheduleGameType(event),opponent=scheduleOpponent(event);if(gameType)$('#gameType').value=gameType;if(event.place)$('#venue').value=event.place;if(opponent)$('#opponent').value=opponent}
function commentForMember(member,date){return parentData.comments.filter(comment=>String(comment.memberId)===String(member.id)&&String(comment.eventDate||'')===date).map(comment=>String(comment.text||'')).join(' ')}
function commentMatchesDate(comment,date){if(String(comment.eventDate||'')===date)return true;const match=String(comment.text||'').match(/(\d{1,2})\s*(?:\/|月)\s*(\d{1,2})(?:日)?/);if(!match||!date)return false;const target=new Date(date+'T00:00:00');return Number(match[1])===target.getMonth()+1&&Number(match[2])===target.getDate()}
function renderAllComments(){const date=currentDate(),title=$('#allCommentsTitle'),list=$('#allCommentList');title.textContent=date?formatDate(date)+'のコメント一覧':'その日のコメント一覧';if(!date){list.innerHTML='<div class="empty">日付を選択してください。</div>';return}const members=new Map(parentData.members.map(member=>[String(member.id),member]));const comments=parentData.comments.filter(comment=>commentMatchesDate(comment,date)&&(String(comment.text||'').trim()||comment.upperGrade)).sort((a,b)=>{const ga=Number(memberGrade(members.get(String(a.memberId))))||0,gb=Number(memberGrade(members.get(String(b.memberId))))||0;return gb-ga||new Date(a.updatedAt||0)-new Date(b.updatedAt||0)});list.innerHTML=comments.length?comments.map(comment=>{const member=members.get(String(comment.memberId))||{name:'回答者'};const text=String(comment.text||'').trim()||'コメントなし';return `<article class="all-comment"><span class="all-comment-grade">${esc(memberGrade(member)||'-')}年</span><span class="all-comment-name">${esc(member.name||'回答者')}</span><span class="all-comment-text">${esc(text)}${comment.upperGrade?'（上級生帯同）':''}</span></article>`}).join(''):'<div class="empty">この日のコメントはありません。</div>'}
function vehicleFrom(text){const models=[['ハイエース',/ハイエース/i],['デリカD:5',/デリカ\s*(?:D\s*[:：]?\s*5)?/i],['ヴォクシー',/ヴォクシー|VOXY/i],['セレナ',/セレナ/i],['ノア',/ノア/i],['アルファード',/アルファード/i],['ヴェルファイア',/ヴェルファイア/i],['ステップワゴン',/ステップ\s*ワゴン/i],['フリード',/フリード/i],['シエンタ',/シエンタ/i],['エスクァイア',/エスクァイア/i]];return models.find(([,pattern])=>pattern.test(text))?.[0]||''}
function capacityFrom(text){const extra=text.match(/運転手(?:を|は)?除(?:いて|き)\s*(\d+)\s*人|運転手以外(?:に)?\s*(\d+)\s*人/);if(extra)return Number(extra[1]||extra[2])+1;const match=text.match(/(\d+)\s*人乗り/);return match?Number(match[1]):0}
function canDrive(text){return /車出し|車だし|車を?出せ|配車(?:可|可能|○|◯|〇)|車(?:可|可能|○|◯|〇)|運転(?:可|可能|します|できます)/i.test(text)}
function candidates(){const info=attendeeSnapshot();return info.parents.map(member=>{const text=commentForMember(member,info.date);return{member,name:String(member.name||''),parent:parentType(member),text,vehicle:vehicleFrom(text),capacity:capacityFrom(text),equipment:/道具/i.test(text),cargo:/荷物|クーラー/i.test(text),umpire:/審判/i.test(text),drive:canDrive(text)}}).filter(item=>item.drive||item.vehicle||item.capacity||item.equipment||item.cargo||item.umpire).sort((a,b)=>(a.parent==='father'?0:1)-(b.parent==='father'?0:1))}
function renderCandidates(){const list=candidates();$('#candidateTotal').textContent=list.length+'名';$('#candidateList').innerHTML=list.length?list.map(item=>`<div class="candidate ${item.parent==='mother'?'mother':''}"><b>${esc(item.name)}</b><small>車種：${esc(item.vehicle||'未入力')}・${item.capacity?item.capacity+'人乗り':'乗車人数未入力'}${item.equipment?'・道具可':''}${item.cargo?'・荷物可':''}${item.umpire?'・審判':''}</small></div>`).join(''):'<div class="empty">この日のコメントから配車候補を抽出できませんでした。手入力で追加できます。</div>'}
function blankCar(type='player',index=cars.length){return{id:'car_'+Date.now().toString(36)+'_'+index,type,driver:'',vehicle:'',capacity:7,navigator:'',players:0,parents:[],coaches:[]}}
function spouseFor(driver,parents){const base=String(driver||'').replace(/[父母]$/,'');const suffix=String(driver||'').endsWith('父')?'母':String(driver||'').endsWith('母')?'父':'';return suffix?parents.find(member=>String(member.name||'')===base+suffix):null}
function makeCar(type,candidate,index,parents,used){const car=blankCar(type,index);if(candidate){car.driver=candidate.name;car.vehicle=candidate.vehicle;car.capacity=candidate.capacity||7;used.add(candidate.name)}if(car.driver){const spouse=spouseFor(car.driver,parents);if(spouse&&!used.has(spouse.name)){car.navigator=spouse.name;used.add(spouse.name)}else{const father=parents.find(member=>parentType(member)==='father'&&!used.has(member.name)&&member.name!==car.driver);if(father){car.navigator=father.name;used.add(father.name)}}}car.parents=[car.driver,car.navigator].filter(name=>parents.some(member=>member.name===name));return car}
function autoCreate(){showError('');if(!currentDate()){showError('日付を選択してください。');return}if(!selectedGrade){showError('対象学年を選択してください。');return}if(!$('#gameType').value){showError('試合区分を選択してください。');return}if(!$('#route').value){showError('移動経路を選択してください。');return}if(!$('#equipmentCount').value){showError('道具車のあり・なしを選択してください。');return}if(!$('#cargoCount').value){showError('荷物車のあり・なしを選択してください。');return}if(numberValue('#carCount')<1){showError('配車数を入力してください。');return}if(!$('#bus').value){showError('バスのあり・なしを選択してください。');return}if(!$('#umpireCar').value){showError('審判号のあり・なしを選択してください。');return}if(!$('#coachCar').value){showError('指導者号のあり・なしを選択してください。');return}if($('#coachCar').value==='yes'&&!$('#coachCount').value){showError('コーチ人数を選択してください。');return}document.querySelector('#status').textContent='' ;const info=attendeeSnapshot();const requested=Math.max(1,numberValue('#carCount'));const equipment=$('#equipmentCount').value==='yes'?1:0;const cargo=$('#cargoCount').value==='yes'?1:0;const umpire=$('#umpireCar').value==='yes';const includeCoach=$('#coachCar').value==='yes';const special=equipment+cargo+(umpire?1:0)+(includeCoach?1:0);if(special>requested){showError('配車数より指導者号・道具車・荷物車・審判号の合計が多くなっています。');return}const pool=candidates(),used=new Set(),nextCandidate=predicate=>pool.find(item=>!used.has(item.name)&&predicate(item));cars=[];if(includeCoach){const coach=blankCar('coach',cars.length);const managerDriving=$('#coachManagerDriver').checked;coach.driver=managerDriving?'監督':$('#coachDriver').value.trim();coach.vehicle=$('#coachVehicle').value.trim();coach.capacity=7;const coachCount=numberValue('#coachCount');coach.coaches=[...($('#coachManager').checked&&!managerDriving?['監督']:[]),...(coachCount?[`コーチ ${coachCount}名`]:[])];cars.push(coach)}for(let i=0;i<equipment;i++){const candidate=nextCandidate(item=>item.equipment)||nextCandidate(item=>item.parent==='father')||nextCandidate(()=>true);cars.push(makeCar('equipment',candidate,cars.length,info.parents,used))}for(let i=0;i<cargo;i++){const candidate=nextCandidate(item=>item.cargo)||nextCandidate(item=>item.parent==='father')||nextCandidate(()=>true);cars.push(makeCar('cargo',candidate,cars.length,info.parents,used))}if(umpire){const candidate=nextCandidate(item=>item.umpire)||nextCandidate(item=>item.parent==='father')||nextCandidate(()=>true);cars.push(makeCar('umpire',candidate,cars.length,info.parents,used))}while(cars.length<requested){const remaining=requested-cars.length;const father=nextCandidate(item=>item.parent==='father');const any=father||nextCandidate(()=>true);const type=remaining===1&&cars.some(car=>car.type==='player')&&(!any||any.parent==='mother')?'support':'player';cars.push(makeCar(type,any,cars.length,info.parents,used))}const playerCars=cars.filter(car=>car.type==='player');let playersLeft=info.playerCount+info.escort;for(const car of playerCars){const free=Math.max(0,car.capacity-1-car.parents.filter(name=>name&&name!==car.driver).length);car.players=Math.min(playersLeft,free);playersLeft-=car.players}if(playersLeft>0)$('#status').textContent='選手が'+playersLeft+'名乗り切れていません。配車数または乗車人数を増やしてください。';const remainingParents=info.parents.map(member=>member.name).filter(name=>!used.has(name));const supportCars=cars.filter(car=>car.type==='support');const otherCars=cars.filter(car=>!['equipment','cargo'].includes(car.type));const motherNames=remainingParents.filter(name=>name.endsWith('母'));const otherNames=remainingParents.filter(name=>!name.endsWith('母'));for(const name of [...motherNames,...otherNames]){const targets=name.endsWith('母')&&supportCars.length?supportCars:otherCars;const target=targets.find(car=>1+car.parents.length+car.players+car.coaches.length<car.capacity)||targets[0];if(target){target.parents.push(name);used.add(name)}}renderCars();renderPreview();$('#status').textContent=$('#status').textContent||'配車案を作成しました。内容は各号車で修正できます。'}
function typeOptions(selected){return Object.entries(typeLabels).map(([value,label])=>`<option value="${value}" ${value===selected?'selected':''}>${label}</option>`).join('')}
function renderCars(){if(!cars.length){$('#carList').innerHTML='<div class="empty">上の「配車案を作成」を押してください。</div>';return}$('#carList').innerHTML=cars.map((car,index)=>`<article class="car-edit" data-index="${index}"><div class="car-no">${index+1}号車</div><label class="car-field">区分<select data-key="type">${typeOptions(car.type)}</select></label><label class="car-field">運転手<input data-key="driver" value="${esc(car.driver)}" placeholder="手入力"></label><label class="car-field">車種<input data-key="vehicle" value="${esc(car.vehicle)}" placeholder="未入力"></label><label class="car-field">乗車可能人数<input data-key="capacity" type="number" min="1" max="60" value="${car.capacity}"></label><label class="car-field">ナビ（削除可）<input data-key="navigator" value="${esc(car.navigator)}" placeholder="なし"></label><label class="car-field players">選手人数<input data-key="players" type="number" min="0" max="60" value="${car.players}"></label><label class="car-field parents">保護者名（読点区切り）<input data-key="parents" value="${esc(car.parents.join('、'))}" placeholder="例：山田父、山田母"></label><label class="car-field">監督・コーチ<input data-key="coaches" value="${esc(car.coaches.join('、'))}" placeholder="指導者号のみ"></label><button class="remove-car" data-remove="${index}" type="button">この号車を削除</button></article>`).join('');$$('[data-index]').forEach(card=>{const index=Number(card.dataset.index);card.querySelectorAll('[data-key]').forEach(input=>input.addEventListener('change',()=>{const key=input.dataset.key;if(key==='parents'||key==='coaches')cars[index][key]=input.value.split(/[、,]/).map(value=>value.trim()).filter(Boolean);else if(key==='capacity'||key==='players')cars[index][key]=Math.max(0,Number(input.value)||0);else cars[index][key]=input.value;renderPreview()}))});$$('[data-remove]').forEach(button=>button.onclick=()=>{cars.splice(Number(button.dataset.remove),1);$('#carCount').value=cars.length;renderCars();renderPreview()})}
function currentAssignment(){return{date:currentDate(),grade:selectedGrade,gameType:$('#gameType').value,route:$('#route').value,opponent:$('#opponent').value.trim(),venue:$('#venue').value.trim(),playerCount:numberValue('#playerCountInput'),firstGradeEscort:numberValue('#firstGradeEscort'),equipmentCount:$('#equipmentCount').value==='yes'?1:0,cargoCount:$('#cargoCount').value==='yes'?1:0,bus:$('#bus').value==='yes',busPassengers:numberValue('#busPassengers'),umpireCar:$('#umpireCar').value==='yes',coachCar:$('#coachCar').value==='yes',coachManager:$('#coachManager').checked,coachManagerDriver:$('#coachManagerDriver').checked,coachCount:numberValue('#coachCount'),carCount:numberValue('#carCount'),cars}}
function applyAssignment(value){if(!value)return false;$('#gameType').value=value.gameType||'';$('#route').value=value.route||'';$('#opponent').value=value.opponent||'';$('#venue').value=value.venue||'';$('#playerCountInput').value=value.playerCount==null?attendeeSnapshot().players.length:Number(value.playerCount);$('#firstGradeEscort').value=Number(value.firstGradeEscort)||'';$('#equipmentCount').value=Number(value.equipmentCount)>0?'yes':'no';$('#cargoCount').value=Number(value.cargoCount)>0?'yes':'no';$('#bus').value=value.bus===true?'yes':value.bus===false?'no':'';$('#busPassengers').value=Number(value.busPassengers)||'';$('#umpireCar').value=value.umpireCar===true?'yes':value.umpireCar===false?'no':'';$('#coachCar').value=value.coachCar===true?'yes':value.coachCar===false?'no':'';const managerDriving=value.coachManagerDriver===true;$('#coachManagerDriver').checked=managerDriving;$('#coachManager').checked=value.coachManager===true&&!managerDriving;$('#coachCount').value=value.coachCount==null?'':String(Number(value.coachCount)||0);$('#carCount').value=Number(value.carCount)||'';cars=Array.isArray(value.cars)?value.cars:[];renderCars();updateCounts();renderCandidates();renderPreview();return true}

function loadSavedForSelection(){const scheduled=scheduleForDate(currentDate());renderScheduleSource(scheduled);renderAllComments();const saved=savedAssignments[assignmentKey()];if(saved){applyAssignment(saved);renderScheduleSource(scheduled);$('#status').textContent='保存済みの配車を読み込みました。'}else{cars=[];resetEntryFields();$('#playerCountInput').value=attendeeSnapshot().players.length;applyScheduleDefaults();renderCars();updateCounts();renderCandidates();renderPreview();$('#status').textContent=''}}
function previewGroup(type,list){if(!list.length)return'';return`<section class="preview-group"><h3>${esc(typeLabels[type])}</h3>${list.map((car,index)=>{const number=cars.indexOf(car)+1;const parentText=car.parents.length?car.parents.join('・'):'なし';const coachText=car.coaches.length?`<span>監督・コーチ：${esc(car.coaches.join('・'))}</span>`:'';return`<div class="preview-car"><div class="preview-car-label">${number}号車</div><div class="preview-detail"><span>運転：${esc(car.driver||'未入力')}　車種：${esc(car.vehicle||'未入力')}<br>ナビ：${esc(car.navigator||'なし')}</span>${coachText}<span>選手 ${car.players||0}名</span><span>保護者 ${car.parents.length}名：${esc(parentText)}</span></div></div>`}).join('')}</section>`}
function renderPreview(){const info=attendeeSnapshot(),gameLabels={official:'公式戦',practice:'練習試合',opening:'開会式',closing:'閉会式'},game=gameLabels[$('#gameType').value]||'未選択',routeLabels={local:'下道',highway:'高速'},route=routeLabels[$('#route').value]||'未選択',grade=selectedGrade?selectedGrade+'年生':'学年未選択',bus=$('#bus').value==='yes'?numberValue('#busPassengers')+'名':$('#bus').value==='no'?'なし':'未選択';const groups=['coach','player','equipment','cargo','support','umpire'].map(type=>previewGroup(type,cars.filter(car=>car.type===type))).join('');$('#previewSheet').innerHTML=`<div class="preview-head"><div class="preview-top"><h2 class="preview-title">${esc(formatDate(info.date))}配車表</h2><span class="grade-badge">${esc(grade)}</span></div><div class="preview-meta">${game}｜対戦：${esc($('#opponent').value.trim()||'未入力')}｜${route}</div><div class="preview-venue"><b>会場：</b>${esc($('#venue').value.trim()||'未入力')}</div></div><div class="preview-counts"><div class="preview-count"><small>配車</small><strong>${cars.length}台</strong></div><div class="preview-count"><small>選手</small><strong>${info.playerCount}名</strong></div><div class="preview-count"><small>1年生帯同</small><strong>${info.escort}名</strong></div><div class="preview-count"><small>保護者</small><strong>${info.parents.length}名</strong></div><div class="preview-count"><small>合計</small><strong>${info.total}名</strong></div><div class="preview-count"><small>バス</small><strong>${bus}</strong></div></div><div class="preview-groups">${groups||'<div class="empty">配車が未作成です。</div>'}</div><div class="preview-note">※道具車・荷物車は、基本的に選手を乗せない配車にしています。　※ナビ（助手席）は、可能な範囲で配置しています。</div>`}
function setView(view){const preview=view==='preview';$('#editView').hidden=preview;$('#previewView').hidden=!preview;$('#editTab').classList.toggle('active',!preview);$('#previewTab').classList.toggle('active',preview);$('#editTab').setAttribute('aria-selected',String(!preview));$('#previewTab').setAttribute('aria-selected',String(preview));if(preview)renderPreview();window.scrollTo({top:0,behavior:'smooth'})}
async function saveAssignment(){if(!currentDate()||!selectedGrade){showError('日付と対象学年を選択してください。');return}if(!cars.length){showError('配車案を作成してください。');return}const button=$('#saveAssignment'),original=button.textContent;button.disabled=true;button.textContent='保存中…';try{const result=await api(ASSIGNMENT_API,{method:'POST',body:JSON.stringify({action:'save',assignment:currentAssignment()})},true);savedAssignments=result.assignments||savedAssignments;$('#status').textContent='配車を保存しました。'}catch(error){showError('配車を保存できませんでした。')}finally{button.disabled=false;button.textContent=original}}
async function saveImage(){const button=$('#saveImage'),original=button.textContent;button.disabled=true;button.textContent='画像を作成中…';$('#imageStatus').textContent='';try{if(typeof html2canvas!=='function')throw new Error('画像機能を読み込めませんでした');const canvas=await html2canvas($('#previewSheet'),{backgroundColor:'#f4f3ef',scale:2,useCORS:true,logging:false});const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png',1));if(!blob)throw new Error('画像を作成できませんでした');const fileName='配車表_'+currentDate().replaceAll('-','')+'.png',file=new File([blob],fileName,{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:formatDate(currentDate())+' 配車表'});return}catch(error){if(error?.name==='AbortError')return}}const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=fileName;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);$('#imageStatus').textContent='画像を保存しました。'}catch(error){$('#imageStatus').textContent='画像を保存できませんでした。もう一度お試しください。'}finally{button.disabled=false;button.textContent=original}}
async function load(){accessPass=readAccessPass();draftAdminPass=sessionStorage.getItem(DRAFT_ADMIN_KEY)||'';if(!accessPass||!draftAdminPass){alert('管理者パスワードを入力して保護者出欠確認から開いてください。');location.replace('./board.html');return}$('#carPage').hidden=false;try{const [parents,players,assignments,schedule]=await Promise.all([api(PARENT_API,{},true),api(PLAYER_API),api(ASSIGNMENT_API,{},true),fetch(SCHEDULE_API,{cache:'no-store'}).then(response=>response.ok?response.json():{data:[]}).catch(()=>({data:[]}))]);parentData=normalize(parents.data);playerData=normalize(players.data);scheduleEvents=Array.isArray(schedule.data)?schedule.data:[];savedAssignments=assignments.assignments||{};const dates=allEventDates();$('#eventDate').innerHTML='<option value="">選択</option>'+dates.map(date=>`<option value="${date}">${esc(formatDate(date))}</option>`).join('');if(!dates.length)throw new Error('日程がありません');$('#eventDate').value='';$('#loading').hidden=true;$('#editView').hidden=false;updateCounts();renderCandidates();renderPreview()}catch(error){sessionStorage.removeItem(DRAFT_ADMIN_KEY);$('#loading').hidden=true;showError('管理者認証を確認できませんでした。チーム専用ページから開き直してください。')}}
$('#editTab').onclick=()=>setView('edit');$('#previewTab').onclick=()=>setView('preview');$('#showPreview').onclick=()=>setView('preview');$('#backToEdit').onclick=()=>setView('edit');$('#autoCreate').onclick=autoCreate;$('#saveAssignment').onclick=saveAssignment;$('#saveImage').onclick=saveImage;$('#addCar').onclick=()=>{cars.push(blankCar('player'));$('#carCount').value=cars.length;renderCars();renderPreview()};$$('.grade-btn').forEach(button=>button.onclick=()=>{$$('.grade-btn').forEach(item=>item.classList.remove('active'));button.classList.add('active');selectedGrade=button.dataset.grade;loadSavedForSelection()});$('#eventDate').onchange=()=>{if(currentDate())loadSavedForSelection()};['#playerCountInput','#firstGradeEscort','#gameType','#route','#opponent','#venue','#equipmentCount','#cargoCount','#bus','#busPassengers','#umpireCar','#coachCar','#coachCount'].forEach(selector=>$(selector).addEventListener('change',()=>{updateCounts();renderCandidates();renderPreview()}));$('#coachManager').addEventListener('change',()=>{if($('#coachManager').checked)$('#coachManagerDriver').checked=false;renderPreview()});$('#coachManagerDriver').addEventListener('change',()=>{if($('#coachManagerDriver').checked)$('#coachManager').checked=false;renderPreview()});load();
