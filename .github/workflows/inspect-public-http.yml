name: Inspect public HTTP response
on:
  push:
    branches: [debug/http-response-20261005]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe root with multiple user agents
        shell: bash
        run: |
          set -euo pipefail
          URL='https://yachiyo-little-senior.netlify.app/'
          probe () {
            name="$1"
            ua="$2"
            echo "===== $name ====="
            curl -sS -L --max-redirs 10 -A "$ua" -D "/tmp/$name.headers" -o "/tmp/$name.html" -w 'FINAL_URL=%{url_effective}\nHTTP=%{http_code}\nTYPE=%{content_type}\nTIME=%{time_total}\nSIZE=%{size_download}\n' "$URL"
            echo "--- response chain ---"
            grep -E '^(HTTP/|location:|content-type:|x-nf-request-id:|cache-control:|server:)' "/tmp/$name.headers" || true
            echo "--- page identity ---"
            grep -Eo '<title>[^<]+</title>|<h1[^>]*>[^<]+</h1>|ページが見つかりません|八千代リトルシニア【公式】' "/tmp/$name.html" | head -10 || true
            echo
          }
          probe safari 'Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 Version/26.0 Mobile/15E148 Safari/604.1'
          probe googlebot 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 Chrome/140.0.0.0 Mobile Safari/537.36 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          probe lighthouse 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 Chrome/140.0.0.0 Mobile Safari/537.36 Chrome-Lighthouse'
          echo '===== direct files ====='
          for path in / /index.html /404.html; do
            echo "--- $path ---"
            curl -sS -o /tmp/direct -D - -w 'FINAL=%{url_effective} HTTP=%{http_code}\n' "https://yachiyo-little-senior.netlify.app$path" | grep -E '^(HTTP/|location:|content-type:|FINAL=)' || true
            grep -Eo '<title>[^<]+</title>|ページが見つかりません|八千代リトルシニア【公式】' /tmp/direct | head -5 || true
          done

      - name: Execute page in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          echo "CHROME=$CHROME"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=8000 \
            --user-agent='Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 Chrome/140.0.0.0 Mobile Safari/537.36 Chrome-Lighthouse' \
            --dump-dom 'https://yachiyo-little-senior.netlify.app/' > /tmp/dom.html
          echo "--- executed DOM identity ---"
          grep -Eo '<title>[^<]+</title>|<h1[^>]*>[^<]+</h1>|ページが見つかりません|八千代リトルシニア【公式】' /tmp/dom.html | head -20 || true
          echo "--- 404 markers count ---"
          grep -c 'ページが見つかりません' /tmp/dom.html || true

      - name: Run Lighthouse and inspect final URLs
        shell: bash
        run: |
          set -euo pipefail
          npm install -g lighthouse@latest >/dev/null 2>&1
          lighthouse 'https://yachiyo-little-senior.netlify.app/'             --output=json             --output-path=/tmp/lhr.json             --chrome-flags='--headless=new --no-sandbox --disable-gpu'             --only-categories=performance,seo             --quiet
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/lhr.json','utf8'));
          console.log(JSON.stringify({
            requestedUrl:r.requestedUrl,
            mainDocumentUrl:r.mainDocumentUrl,
            finalDisplayedUrl:r.finalDisplayedUrl,
            finalUrl:r.finalUrl,
            fetchTime:r.fetchTime,
            runtimeError:r.runtimeError,
            performance:r.categories?.performance?.score,
            seo:r.categories?.seo?.score,
            finalScreenshot:r.audits?.['final-screenshot']?.details?.data ? 'present' : 'missing',
            lcpNode:r.audits?.['largest-contentful-paint-element']?.details?.items?.[0]?.node?.snippet || null
          },null,2));
          NODE

      - name: Summarize Lighthouse bottlenecks
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/lhr.json','utf8'));
          const ids=[
            'first-contentful-paint','largest-contentful-paint','speed-index',
            'total-blocking-time','cumulative-layout-shift','interactive',
            'render-blocking-resources','unused-javascript','unused-css-rules',
            'uses-optimized-images','uses-responsive-images','modern-image-formats',
            'network-dependency-tree-insight','render-blocking-insight','image-delivery-insight',
            'forced-reflow-insight','lcp-breakdown-insight'
          ];
          for(const id of ids){
            const a=r.audits?.[id];
            if(!a) continue;
            console.log('\n### '+id);
            console.log('score=',a.score,'display=',a.displayValue||'');
            if(a.details?.overallSavingsMs!=null) console.log('savingsMs=',a.details.overallSavingsMs);
            if(a.details?.overallSavingsBytes!=null) console.log('savingsBytes=',a.details.overallSavingsBytes);
            if(Array.isArray(a.details?.items)){
              console.log(JSON.stringify(a.details.items.slice(0,12),null,2));
            }
          }
          NODE


# rerun after critical home JS inlining
