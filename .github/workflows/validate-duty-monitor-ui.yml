name: Validate duty monitor UI
on:
  push:
    branches: [ui/duty-monitor-statuses-20261005]
permissions:
  contents: write
jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/duty-monitor-statuses-20261005
      - name: Validate duty UI only
        shell: bash
        run: |
          set -euo pipefail
          node --check board-duty-roster.js
          node --test tests/duty-roster.test.cjs tests/duty-grades.test.mjs tests/duty-exclusions.test.cjs
          grep -q 'id="dutyMonitorRejected"' board.html
          grep -q 'id="dutyMonitorNoLine"' board.html
          grep -q 'noLineFallback:item.noLineFallback===true' board-duty-roster.js
          grep -q 'LINE利用不可' board-duty-roster.js
          git diff --check origin/main...HEAD
      - name: Publish only validated display changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git checkout ui/duty-monitor-statuses-20261005 -- board.html board-duty-roster.js
          node --check board-duty-roster.js
          node --test tests/duty-roster.test.cjs tests/duty-grades.test.mjs tests/duty-exclusions.test.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add board.html board-duty-roster.js
          git commit -m 'ui(duty): clarify admin request statuses'
          git push origin main
