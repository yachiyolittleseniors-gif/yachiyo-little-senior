name: Validate duty monitor trace
on:
  push:
    branches: [ui/duty-monitor-trace-20261005]
permissions:
  contents: write
jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/duty-monitor-trace-20261005
          fetch-depth: 0
      - name: Validate trace changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          node --check board-duty-roster.js
          node --check netlify/functions/duty-change-requests.mjs
          grep -q 'id="dutyMonitorTrace"' board.html
          grep -q 'eventHistory' netlify/functions/duty-change-requests.mjs
          grep -q 'data-duty-monitor-trace' board-duty-roster.js
          node --test tests/duty-roster.test.cjs tests/duty-grades.test.mjs >/tmp/duty-tests.out 2>&1
          git diff --check origin/main...HEAD
      - name: Publish validated files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git checkout ui/duty-monitor-trace-20261005 -- board.html board-duty-roster.js netlify/functions/duty-change-requests.mjs
          node --check board-duty-roster.js
          node --check netlify/functions/duty-change-requests.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add board.html board-duty-roster.js netlify/functions/duty-change-requests.mjs
          git commit -m 'feat(duty): trace monitor issues by request number'
          git push origin main
