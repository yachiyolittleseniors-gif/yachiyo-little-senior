name: Verify monthly duty grades
on:
  push:
    branches: [main, fix/duty-month-grades-v1-20261005]
    paths:
      - 'board.html'
      - '*duty*'
      - 'netlify/duty-grade-policy.cjs'
      - 'netlify/prepare-duty-grades.mjs'
      - 'netlify/functions/site-data.mjs'
      - 'netlify/functions/duty-change-requests.mjs'
      - 'tests/duty-grades.test.mjs'
      - '.github/workflows/duty-grade-verification.yml'
  pull_request:
    paths:
      - 'board.html'
      - '*duty*'
      - 'netlify/duty-grade-policy.cjs'
      - 'netlify/prepare-duty-grades.mjs'
      - 'netlify/functions/site-data.mjs'
      - 'netlify/functions/duty-change-requests.mjs'
      - 'tests/duty-grades.test.mjs'
      - '.github/workflows/duty-grade-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: duty-grades-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check changed browser and server script syntax
        run: |
          node --check board-duty-roster.js
          node --check board-duty-auto-test.js
          node --check duty-image-reader.js
          node --check duty-grade-policy.js
          node --check netlify/functions/site-data.mjs
          node --check netlify/functions/duty-change-requests.mjs
          cmp duty-grade-policy.js netlify/duty-grade-policy.cjs
      - name: Test duty-grade behavior and existing CSP checks
        run: node --test tests/duty-grades.test.mjs tests/home-csp.test.mjs
