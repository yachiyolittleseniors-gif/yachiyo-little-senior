<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#071426">
<title>当番変更申請｜八千代リトルシニア</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071426;color:#17202b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);background:#fff;border:1px solid #c79a3b;border-radius:20px;padding:26px 22px;box-shadow:0 18px 48px rgba(0,0,0,.28)}
.kicker{font-size:11px;font-weight:900;letter-spacing:.14em;color:#b58a31}.title{margin:6px 0 14px;font-size:23px;color:#071426}.msg{line-height:1.8;font-weight:700;color:#4d5869}
.detail{margin:16px 0;padding:15px;border-radius:14px;background:#f7f3e8;line-height:1.8;font-weight:700}.line{display:block;width:100%;margin-top:18px;padding:15px 16px;border-radius:14px;background:#06c755;color:#fff;text-align:center;text-decoration:none;font-weight:900;font-size:16px}
.small{display:block;margin-top:12px;color:#697384;font-size:12px;line-height:1.7}.error{color:#b42318;font-weight:800}.spinner{width:28px;height:28px;border:3px solid #ddd;border-top-color:#b58a31;border-radius:50%;animation:r 1s linear infinite;margin:18px auto}@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap"><main class="card">
<div class="kicker">CHANGE REQUEST</div>
<h1 class="title">当番変更申請</h1>
<div id="content"><div class="spinner"></div><p class="msg">LINE認証を確認して申請を続行しています。</p></div>
</main></div>
<script src="./duty-line-resume.js?v=20261002-1"></script>
</body>
</html>
