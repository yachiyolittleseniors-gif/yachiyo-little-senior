<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="author" content="tatsuki.saitoh">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#071426">
<title>資料を開いています｜八千代リトルシニア</title>
<style>
:root{--navy:#071426;--gold:#c79a3b;--gold2:#e2bd67;--bg:#f4f3ef}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--navy)}
.loading{width:min(440px,100%);padding:32px 20px;border:1px solid #ddd9d0;border-top:4px solid var(--gold);border-radius:12px;background:#fff;text-align:center;box-shadow:0 12px 30px rgba(7,20,38,.08)}
.loading strong{display:block;font-size:18px}.loading p{margin:10px 0 0;color:#737d89;font-size:13px;line-height:1.7}
.back{display:inline-block;margin-top:20px;padding:11px 18px;border:1px solid var(--gold);border-radius:8px;background:var(--navy);color:var(--gold2);font-size:12px;font-weight:900;text-decoration:none}
.error{color:#9b2727}
</style>
</head>
<body>
<main class="loading">
  <strong id="status">資料を開いています。</strong>
  <p id="detail">そのままお待ちください。</p>
  <a class="back" href="./secretariat-documents.html">一覧へ戻る</a>
</main>
<script>
(()=>{
  const API='/.netlify/functions/site-data?section=board-meeting-documents';
  const AUTH_API='/.netlify/functions/site-data?section=access-settings';
  const status=document.getElementById('status');
  const detail=document.getElementById('detail');

  async function verifyAccess(password){
    if(!password)return false;
    try{
      const response=await fetch(AUTH_API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'verifyAccessPassword',password})});
      if(response.ok){sessionStorage.setItem('yachiyoAttendancePass',password);return true}
    }catch(error){}
    return false;
  }

  async function requireAccess(){
    const saved=sessionStorage.getItem('yachiyoAttendancePass')||'';
    if(await verifyAccess(saved))return saved;
    const entered=prompt('パスワードを入力してください。');
    if(entered!==null&&await verifyAccess(entered))return entered;
    return '';
  }

  async function open(){
    const id=new URLSearchParams(location.search).get('id')||'';
    if(!id){showError('資料が指定されていません。');return}
    const access=await requireAccess();
    if(!access){showError('パスワードを確認できませんでした。');return}
    try{
      const response=await fetch(API+'&file='+encodeURIComponent(id),{cache:'no-store',headers:{'x-access-password':access}});
      if(!response.ok)throw new Error();
      const blob=await response.blob();
      if(!blob.size)throw new Error();
      location.replace(URL.createObjectURL(blob));
    }catch(error){showError('資料を開けませんでした。')}
  }

  function showError(message){
    status.textContent=message;
    status.classList.add('error');
    detail.textContent='一覧へ戻り、ページを再読み込みしてから再度お試しください。';
  }

  open();
})();
</script>
</body>
</html>
