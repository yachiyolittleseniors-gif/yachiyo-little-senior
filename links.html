<style>
*{box-sizing:border-box}
:root{--navy:#07162b;--navy2:#0b213b;--gold:#caa64b;--gold2:#dfbf70;--paper:#f6f5f1;--line:#ddd8cd;--ink:#0a1729}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
header{background:var(--navy);color:#fff;border-top:2px solid var(--gold);padding:22px 18px}

.link-list{display:grid;gap:14px}
.link-card{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:70px;padding:15px 18px;border:1px solid var(--gold);border-radius:14px;color:var(--ink);text-decoration:none;background:#fff;transition:.18s ease}
.link-card:hover{background:var(--navy);color:#fff;transform:translateY(-1px)}
.link-title{font-size:15px;font-weight:700;line-height:1.45;white-space:pre-line}.link-arrow{flex:0 0 auto;color:var(--gold);font-size:21px;font-weight:800}

.admin{display:none;margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}body.editing .admin{display:block}
.admin h2{margin:0 0 16px;font-size:21px}.editor{display:grid;gap:12px}
.editor-row{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;padding:12px;background:#f7f7f5;border:1px solid #e2dfd7;border-radius:12px}
.editor-row input,.editor-row textarea{width:100%;min-width:0;padding:12px;border:1px solid #cfd3d8;border-radius:9px;font:inherit;font-size:16px}.editor-row textarea{min-height:68px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer}
.delete{background:#fff;color:#9d2633;border:1px solid #ddd}.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:16px}

.restored-footer{background:#071426;color:#fff;border-top:1px solid rgba(199,154,59,.45);padding:26px 18px 18px}
.restored-footer-inner{max-width:1180px;margin:0 auto}

.footer-privacy-link{text-align:center;margin-top:10px;font-size:11px}.footer-privacy-link a{color:#8f9aa7;text-decoration:none}
.restored-footer-copy{text-align:center;border-top:1px solid rgba(255,255,255,.12);margin-top:18px;padding-top:15px;color:#8f9aa7;font-size:11px;letter-spacing:.08em}

<script>
(function(){
  const API='/.netlify/functions/site-data?section=links';
  const defaults=[
    {name:'日本リトルシニア中学硬式野球協会 関東連盟',url:'https://www.kantoleague.net/shop/sphone/'},
    {name:'日本リトルシニア 関東連盟 東関東支部',url:'https://www.kantoleague.net/shop/block/?action=detail&b_id=3'},
    {name:'超野球専門店CV',url:'https://www.spcv.jp'},
    {name:'超野球専門店CV\n八千代リトルシニア専用ページ',url:'https://www.sportscv.jp/p/auth/team_yachiyo-sr'},
    {name:'Instagram',url:'https://www.instagram.com/yachiyo_little_senior/'},
    {name:'Facebook',url:'https://www.facebook.com/874baseball'}
  ];
  let links=defaults.map(x=>({...x}));
  const list=document.getElementById('linkList');
  const editor=document.getElementById('linkEditor');
  const status=document.getElementById('status');
  const adminBtn=document.getElementById('adminBtn');

  function safeUrl(value){
    try{const u=new URL(String(value||''));return /^https?:$/.test(u.protocol)?u.href:''}catch(e){return ''}
  }
  function clean(items){
    return (Array.isArray(items)?items:[]).map(x=>({name:String(x?.name||'').trim(),url:String(x?.url||'').trim()})).filter(x=>x.name||x.url);
  }
  function normalize(items){
    const normalized=clean(items).map(item=>{
      if(item.url==='https://www.kantoleague.net/shop/sphone/')return {...item,name:'日本リトルシニア中学硬式野球協会 関東連盟'};
      if(item.name==='超野球専門店CV'&&/^https:\/\/www\.sportscv\.jp\/?$/.test(item.url))return {...item,url:'https://www.spcv.jp'};
      if(item.url==='https://www.sportscv.jp/p/auth/team_yachiyo-sr')return {...item,name:'超野球専門店CV\n八千代リトルシニア専用ページ'};
      return item;
    });
    const leagueIndex=normalized.findIndex(item=>item.url==='https://www.kantoleague.net/shop/sphone/');
    const branchIndex=normalized.findIndex(item=>item.url==='https://www.kantoleague.net/shop/block/?action=detail&b_id=3');
    if(leagueIndex>branchIndex&&branchIndex>=0){const [league]=normalized.splice(leagueIndex,1);normalized.splice(branchIndex,0,league)}
    return normalized;
  }
  function render(){
    list.replaceChildren();
    const valid=links.filter(x=>x.name&&safeUrl(x.url));
    if(!valid.length){const p=document.createElement('div');p.className='empty';p.textContent='現在、公開中のリンクはありません。';list.appendChild(p);return}
    valid.forEach(item=>{
      const a=document.createElement('a');a.className='link-card';a.href=safeUrl(item.url);a.target='_blank';a.rel='noopener noreferrer';
      const title=document.createElement('span');title.className='link-title';title.textContent=item.name;
      const arrow=document.createElement('span');arrow.className='link-arrow';arrow.setAttribute('aria-hidden','true');arrow.textContent='›';
      a.append(title,arrow);list.appendChild(a);
    });
  }
  function renderEditor(){
    editor.replaceChildren();
    links.forEach((item,index)=>{
      const row=document.createElement('div');row.className='editor-row';
      const name=document.createElement('textarea');name.rows=2;name.placeholder='表示名';name.value=item.name;name.dataset.i=index;name.dataset.k='name';
      const url=document.createElement('input');url.type='url';url.placeholder='https://';url.value=item.url;url.dataset.i=index;url.dataset.k='url';
      const del=document.createElement('button');del.type='button';del.className='delete';del.textContent='削除';del.dataset.del=index;
      row.append(name,url,del);editor.appendChild(row);
    });
  }
  async function load(){
    try{const r=await fetch(API,{cache:'no-store'});if(r.ok){const j=await r.json();if(Array.isArray(j.data)&&j.data.length)links=normalize(j.data)}}catch(e){}
    render();
  }
  async function openAdmin(){
    let p=sessionStorage.getItem('yachiyoAdminPassword')||'';
    if(!p)p=prompt('管理者パスワードを入力してください')||'';
    if(!p)return;
    status.textContent='確認中...';
    try{
      const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-admin-password':p},body:JSON.stringify({data:links})});
      if(r.status===429){alert('試行回数の上限です。15分後に再度お試しください。');status.textContent='';return}
      if(r.status===401){alert('管理者パスワードが違います。');status.textContent='';return}
      if(!r.ok){alert('管理機能の接続設定を確認してください。');status.textContent='';return}
      sessionStorage.setItem('yachiyoAdminPassword',p);document.body.classList.add('editing');adminBtn.textContent='管理終了';renderEditor();status.textContent='';
    }catch(e){alert('管理機能に接続できませんでした。');status.textContent=''}
  }
  adminBtn.addEventListener('click',()=>{
    if(document.body.classList.contains('editing')){document.body.classList.remove('editing');sessionStorage.removeItem('yachiyoAdminPassword');adminBtn.textContent='管理';adminBtn.style.display='none';load();return}
    openAdmin();
  });
  document.getElementById('linkAdd').addEventListener('click',()=>{links.push({name:'',url:''});renderEditor()});
  editor.addEventListener('input',e=>{if(!e.target.dataset.k)return;links[Number(e.target.dataset.i)][e.target.dataset.k]=e.target.value});
  editor.addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;links.splice(Number(b.dataset.del),1);renderEditor()});
  document.getElementById('linkCancel').addEventListener('click',()=>{document.body.classList.remove('editing');adminBtn.textContent='管理';adminBtn.style.display='none';load()});
  document.getElementById('linkSave').addEventListener('click',async()=>{
    const next=clean(links);if(next.some(x=>!x.name||!safeUrl(x.url))){alert('表示名と正しいURLを入力してください。');return}
    const p=sessionStorage.getItem('yachiyoAdminPassword')||'';status.textContent='保存中...';
    try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-admin-password':p},body:JSON.stringify({data:next})});if(r.status===429){alert('試行回数の上限です。15分後に再度お試しください。');status.textContent='';return}if(r.status===401){alert('管理者パスワードが違います。');status.textContent='';return}if(!r.ok){alert('保存できませんでした。');status.textContent='';return}links=next;render();renderEditor();status.textContent='保存しました。'}catch(e){alert('保存できませんでした。');status.textContent=''}
  });
  sessionStorage.removeItem('yachiyoAdminPassword');
  let taps=0,timer=null;
  const copyright=document.querySelector('.footer-copy');
  if(copyright)copyright.addEventListener('pointerup',e=>{if(e.target.closest('#adminBtn'))return;taps++;clearTimeout(timer);timer=setTimeout(()=>taps=0,2000);if(taps>=5){taps=0;adminBtn.style.display='block'}},{passive:true});
  load();
})();
</script>
<script id="compact-site-header-script">
(function(){
  const button=document.getElementById('siteMenuButton');
  const menu=document.getElementById('siteMenu');
  if(!button||!menu)return;
  function setOpen(open){
    menu.classList.toggle('open',open);
    button.setAttribute('aria-expanded',open?'true':'false');
    button.setAttribute('aria-label',open?'メニューを閉じる':'メニューを開く');
    button.textContent=open?'✕':'☰';
  }
  button.addEventListener('click',function(e){
    e.preventDefault();
    e.stopPropagation();
    setOpen(!menu.classList.contains('open'));
  });
  menu.querySelectorAll('a').forEach(function(link){
    link.addEventListener('click',function(){setOpen(false)});
  });
  document.addEventListener('click',function(e){
    if(menu.classList.contains('open')&&!e.target.closest('.site-header'))setOpen(false);
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape')setOpen(false);
  });
})();
</script>

<script id="unified-admin-reveal-script">
(function(){
  const button=document.getElementById("adminBtn");
  const trigger=document.querySelector(".restored-footer-copy");
  if(!button||!trigger)return;
  button.classList.add('unified-admin-toggle');
  trigger.classList.add('unified-admin-reveal');
  trigger.setAttribute('aria-label','管理ボタンを表示');

  let taps=0;
  let timer=null;
  let lastTouchAt=0;
  function reset(){
    taps=0;
    clearTimeout(timer);
    timer=null;
  }
  function countTap(){
    taps++;
    clearTimeout(timer);
    timer=setTimeout(reset,2200);
    if(taps>=5){
      reset();
      button.style.setProperty('display','block','important');
    }
  }
  trigger.addEventListener('pointerup',function(event){
    if(event.pointerType==='touch'){
      event.stopImmediatePropagation();
      return;
    }
    event.stopImmediatePropagation();
    countTap();
  },{capture:true,passive:true});
  trigger.addEventListener('touchend',function(event){
    lastTouchAt=Date.now();
    event.preventDefault();
    event.stopImmediatePropagation();
    countTap();
  },{capture:true,passive:false});
  trigger.addEventListener('click',function(event){
    if(Date.now()-lastTouchAt<800){
      event.preventDefault();
      event.stopImmediatePropagation();
      return;
    }
    event.stopImmediatePropagation();
    countTap();
  },{capture:true,passive:false});
  trigger.addEventListener('dblclick',function(event){
    event.preventDefault();
    event.stopImmediatePropagation();
  },{capture:true,passive:false});
})();
</script>

<script id="admin-start-position-unified">
(()=>{
  const watched=document.querySelector('body');
  if(!watched)return;
  const mode='page';
  const spacerId='admin-position-scroll-spacer';
  const delays=[0,100,300,700,1200];
  let timers=[];
  let resizeTimer=0;
  let wasOpen=watched.classList.contains('editing');
  const previousHtmlAnchor=document.documentElement.style.overflowAnchor;
  const previousBodyAnchor=document.body.style.overflowAnchor;

  function isOpen(){return watched.classList.contains('editing');}
  function clearTimers(){
    timers.forEach(clearTimeout);
    timers=[];
    clearTimeout(resizeTimer);
  }
  function setAnchoring(disabled){
    if(mode!=='page')return;
    document.documentElement.style.overflowAnchor=disabled?'none':previousHtmlAnchor;
    document.body.style.overflowAnchor=disabled?'none':previousBodyAnchor;
  }
  function ensureSpacer(){
    if(mode!=='page')return;
    let spacer=document.getElementById(spacerId);
    if(!spacer){
      spacer=document.createElement('div');
      spacer.id=spacerId;
      spacer.setAttribute('aria-hidden','true');
      spacer.style.cssText='height:110dvh;min-height:720px;pointer-events:none;';
      document.body.appendChild(spacer);
    }
  }
  function removeSpacer(){document.getElementById(spacerId)?.remove();}
  function align(){
    if(!isOpen())return;
    const target=document.querySelector('main');
    if(!target)return;
    if(mode==='panel'){
      target.scrollTop=0;
      return;
    }
    ensureSpacer();
    const header=document.querySelector('.header,.site-header');
    const desiredTop=(header?header.getBoundingClientRect().bottom:0)+12;
    const nextTop=Math.max(0,Math.round(window.scrollY+target.getBoundingClientRect().top-desiredTop));
    window.scrollTo(0,nextTop);
  }
  function scheduleAlign(){
    clearTimers();
    setAnchoring(true);
    ensureSpacer();
    delays.forEach(delay=>timers.push(setTimeout(align,delay)));
  }

  new MutationObserver(()=>{
    const open=isOpen();
    if(open&&!wasOpen)scheduleAlign();
    if(!open&&wasOpen){
      clearTimers();
      removeSpacer();
      setAnchoring(false);
    }
    wasOpen=open;
  }).observe(watched,{attributes:true,attributeFilter:['class']});

  const target=document.querySelector('main');
  if(target&&'ResizeObserver' in window){
    new ResizeObserver(()=>{
      if(!isOpen())return;
      clearTimeout(resizeTimer);
      resizeTimer=setTimeout(align,60);
    }).observe(target);
  }

  window.addEventListener('orientationchange',()=>{if(isOpen())scheduleAlign();});
  if(wasOpen)scheduleAlign();
})();
</script>
<script id="seniorcup-menu-visibility">
(()=>{
  const menus=document.querySelectorAll('.mobile-links,.site-menu');
  if(!menus.length)return;
  const links=[];
  menus.forEach(menu=>{
    let link=menu.querySelector('[data-seniorcup-menu-link]');
    if(!link){
      link=document.createElement('a');
      link.href='./seniorcup.html';
      link.textContent='八千代リトルシニア杯';
      link.setAttribute('data-seniorcup-menu-link','');
      const termsLink=[...menu.querySelectorAll('a')].find(item=>{
        const href=item.getAttribute('href')||'';
        return /(?:terms|site-policy)\.html(?:$|[?#])/.test(href)||item.textContent.includes('サイト利用について');
      });
      if(termsLink)menu.insertBefore(link,termsLink);
      else menu.appendChild(link);
    }
    links.push(link);
  });

  function apply(visible){
    links.forEach(link=>{
      if(visible)link.style.removeProperty('display');
      else link.style.setProperty('display','none','important');
      link.setAttribute('aria-hidden',visible?'false':'true');
    });
  }

  let visible=true;
  try{visible=localStorage.getItem('yachiyoSeniorCupVisible')!=='false'}catch(e){}
  apply(visible);

  fetch('/.netlify/functions/site-data?section=seniorcup-settings',{cache:'no-store'})
    .then(response=>response.ok?response.json():null)
    .then(json=>{
      if(json&&json.data&&typeof json.data.visible==='boolean'){
        visible=json.data.visible;
        try{localStorage.setItem('yachiyoSeniorCupVisible',String(visible))}catch(e){}
        apply(visible);
      }
    })
    .catch(()=>{});

  new MutationObserver(()=>{
    if(document.documentElement.classList.contains('seniorcup-hidden'))apply(false);
    else if(document.querySelector('.seniorcup-home-banner'))apply(true);
  }).observe(document.documentElement,{attributes:true,attributeFilter:['class']});
})();
</script>
