<!doctype html>
<html lang="ja">
<head>
<!-- Created by tatsuki.saitoh -->
<meta name="author" content="tatsuki.saitoh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>リンク集｜八千代リトルシニア公式</title>
<meta name="description" content="八千代リトルシニアの関連リンク集です。">
<link rel="canonical" href="https://yachiyo-little-senior.netlify.app/links.html">
<style>
*{box-sizing:border-box}
:root{--navy:#07162b;--navy2:#0b213b;--gold:#caa64b;--gold2:#dfbf70;--paper:#f6f5f1;--line:#ddd8cd;--ink:#0a1729}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
header{background:var(--navy);color:#fff;border-top:2px solid var(--gold);padding:22px 18px}
.head{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:20px}
.head a{color:#fff;text-decoration:none;font-weight:800}.head a:last-child{color:var(--gold2)}
.hero{background:var(--navy);color:#fff;padding:48px 20px 54px;border-bottom:1px solid var(--gold)}
.hero>div{max-width:1050px;margin:auto}.eyebrow{letter-spacing:.22em;color:var(--gold2);font-weight:800}.hero h1{font-family:serif;font-size:clamp(40px,8vw,68px);margin:18px 0 0}
main{max-width:900px;margin:0 auto;padding:36px 18px 80px}
.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px 22px;box-shadow:0 12px 32px rgba(0,0,0,.06)}
.link-list{display:grid;gap:14px}
.link-card{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:78px;padding:18px 20px;border:1px solid var(--gold);border-radius:14px;color:var(--ink);text-decoration:none;background:#fff;transition:.18s ease}
.link-card:hover{background:var(--navy);color:#fff;transform:translateY(-1px)}
.link-title{font-size:17px;font-weight:800;line-height:1.55;white-space:pre-line}.link-arrow{flex:0 0 auto;color:var(--gold);font-size:24px;font-weight:800}
.empty{padding:24px;text-align:center;color:#697383}
.admin{display:none;margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}body.editing .admin{display:block}
.admin h2{margin:0 0 16px;font-size:21px}.editor{display:grid;gap:12px}
.editor-row{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;padding:12px;background:#f7f7f5;border:1px solid #e2dfd7;border-radius:12px}
.editor-row input,.editor-row textarea{width:100%;min-width:0;padding:12px;border:1px solid #cfd3d8;border-radius:9px;font:inherit;font-size:16px}.editor-row textarea{min-height:68px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer}
.delete{background:#fff;color:#9d2633;border:1px solid #ddd}.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:16px}
.add,.save{background:var(--gold);color:var(--navy)}.cancel{background:#eee;color:#222}.status{min-height:22px;margin-top:10px;color:#536071;font-size:14px;text-align:right}
.admin-toggle{display:none;position:fixed;right:18px;bottom:18px;z-index:9998;border:1px solid rgba(199,154,59,.65);background:var(--navy);color:#e2bd67;border-radius:999px;padding:9px 12px;font-size:12px;box-shadow:0 8px 22px rgba(0,0,0,.18)}
footer{background:var(--navy);color:#fff;border-top:1px solid rgba(202,166,75,.6);padding:28px 18px 22px}
.footer-inner{max-width:900px;margin:auto}.footer-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid rgba(255,255,255,.1)}
.footer-nav a{display:flex;align-items:center;justify-content:center;min-height:58px;padding:10px;color:#fff;text-decoration:none;font-weight:700;border-bottom:1px solid rgba(255,255,255,.1)}
.footer-nav a:nth-child(odd){border-right:1px solid rgba(255,255,255,.1)}.ground-address{padding:16px 6px 8px;text-align:center;color:#d7dde5;font-size:12px;line-height:1.7}.ground-address a{color:inherit;text-decoration:none}.footer-privacy{text-align:center;margin-top:10px;font-size:11px}.footer-privacy a{color:#8f9aa7;text-decoration:none}.footer-copy{padding-top:20px;text-align:center;color:#94a0ae;font-size:12px;letter-spacing:.08em}
@media(max-width:600px){main{padding:24px 14px 70px}.panel{padding:20px 14px}.link-card{padding:16px 15px}.link-title{font-size:15px}.editor-row{grid-template-columns:1fr}.delete{justify-self:end}.admin-toggle{right:12px;bottom:74px;padding:8px 10px;font-size:11px}}
</style>
</head>
<body>
<header><div class="head"><a href="./index.html">八千代リトルシニア</a><a href="./index.html">HOME</a></div></header>
<section class="hero"><div><div class="eyebrow">LINKS</div><h1>リンク集</h1></div></section>
<main>
  <section class="panel" aria-label="関連リンク">
    <div id="linkList" class="link-list"></div>
    <div class="admin" id="linkAdmin">
      <h2>リンク集を編集</h2>
      <div id="linkEditor" class="editor"></div>
      <div class="actions">
        <button class="add" id="linkAdd" type="button">＋ 追加</button>
        <button class="cancel" id="linkCancel" type="button">キャンセル</button>
        <button class="save" id="linkSave" type="button">保存</button>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
    </div>
  </section>
</main>
<button class="admin-toggle" id="adminBtn" type="button">管理</button>
<footer>
  <div class="footer-inner">
    <nav class="footer-nav" aria-label="フッターナビゲーション">
      <a href="./index.html">HOME</a><a href="./team.html">チーム紹介</a>
      <a href="./players.html">選手紹介</a><a href="./results.html">試合結果</a>
      <a href="./schedule.html">スケジュール</a><a href="./join.html">入団案内</a>
      <a href="./contact.html">お問い合わせ</a><a href="./links.html">リンク集</a>
      <a href="./rules.html">チーム規約 🔒</a><a href="./board.html">チーム内案内板 🔒</a>
    </nav>
    <div class="ground-address"><a href="https://www.google.com/maps/search/?api=1&amp;query=%E5%8D%83%E8%91%89%E7%9C%8C%E5%85%AB%E5%8D%83%E4%BB%A3%E5%B8%82%E5%B3%B6%E7%94%B0%E5%8F%B0%EF%BC%97%EF%BC%97%EF%BC%95" target="_blank" rel="noopener noreferrer">グラウンド案内：千葉県八千代市島田台７７５</a></div>
    <div class="footer-privacy"><a href="./privacy.html">プライバシーポリシー</a></div>
    <div class="footer-copy">© YACHIYO LITTLE SENIOR. All Rights Reserved.</div>
  </div>
</footer>
<script>
(function(){
  const API='/.netlify/functions/site-data?section=links';
  const defaults=[
    {name:'日本リトルシニア中学硬式野球協会\n関東連盟',url:'https://www.kantoleague.net/shop/sphone/'},
    {name:'日本リトルシニア 関東連盟 東関東支部',url:'https://www.kantoleague.net/shop/block/?action=detail&b_id=3'},
    {name:'超野球専門店CV',url:'https://www.spcv.jp'},
    {name:'超野球専門店CV\n八千代リトルシニア専用',url:'https://www.sportscv.jp/p/auth/team_yachiyo-sr'},
    {name:'Instagram',url:'https://www.instagram.com/yachiyo_little_senior?igsi=MTl4N3dneG9uY2ZxcA=='},
    {name:'Facebook',url:'https://www.facebook.com/share/1DakdBtEv6/?mibextid=wwXIfr'}
  ];
  let links=defaults.map(x=>({...x}));
  const list=document.getElementById('linkList');
  const editor=document.getElementById('linkEditor');
  const status=document.getElementById('status');
  const adminBtn=document.getElementById('adminBtn');

  function safeUrl(value){
    try{const u=new URL(String(value||''));return /^https?:$/.test(u.protocol)?u.href:''}catch(e){return ''}
  }
  function clean(items){
    return (Array.isArray(items)?items:[]).map(x=>({name:String(x?.name||'').trim(),url:String(x?.url||'').trim()})).filter(x=>x.name||x.url);
  }
  function normalize(items){
    const normalized=clean(items).map(item=>{
      if(item.url==='https://www.kantoleague.net/shop/sphone/')return {...item,name:'日本リトルシニア中学硬式野球協会\n関東連盟'};
      if(item.name==='超野球専門店CV'&&/^https:\/\/www\.sportscv\.jp\/?$/.test(item.url))return {...item,url:'https://www.spcv.jp'};
      if(item.url==='https://www.sportscv.jp/p/auth/team_yachiyo-sr')return {...item,name:'超野球専門店CV\n八千代リトルシニア専用'};
      return item;
    });
    const leagueIndex=normalized.findIndex(item=>item.url==='https://www.kantoleague.net/shop/sphone/');
    const branchIndex=normalized.findIndex(item=>item.url==='https://www.kantoleague.net/shop/block/?action=detail&b_id=3');
    if(leagueIndex>branchIndex&&branchIndex>=0){const [league]=normalized.splice(leagueIndex,1);normalized.splice(branchIndex,0,league)}
    return normalized;
  }
  function render(){
    list.replaceChildren();
    const valid=links.filter(x=>x.name&&safeUrl(x.url));
    if(!valid.length){const p=document.createElement('div');p.className='empty';p.textContent='現在、公開中のリンクはありません。';list.appendChild(p);return}
    valid.forEach(item=>{
      const a=document.createElement('a');a.className='link-card';a.href=safeUrl(item.url);a.target='_blank';a.rel='noopener noreferrer';
      const title=document.createElement('span');title.className='link-title';title.textContent=item.name;
      const arrow=document.createElement('span');arrow.className='link-arrow';arrow.setAttribute('aria-hidden','true');arrow.textContent='›';
      a.append(title,arrow);list.appendChild(a);
    });
  }
  function renderEditor(){
    editor.replaceChildren();
    links.forEach((item,index)=>{
      const row=document.createElement('div');row.className='editor-row';
      const name=document.createElement('textarea');name.rows=2;name.placeholder='表示名';name.value=item.name;name.dataset.i=index;name.dataset.k='name';
      const url=document.createElement('input');url.type='url';url.placeholder='https://';url.value=item.url;url.dataset.i=index;url.dataset.k='url';
      const del=document.createElement('button');del.type='button';del.className='delete';del.textContent='削除';del.dataset.del=index;
      row.append(name,url,del);editor.appendChild(row);
    });
  }
  async function load(){
    try{const r=await fetch(API,{cache:'no-store'});if(r.ok){const j=await r.json();if(Array.isArray(j.data)&&j.data.length)links=normalize(j.data)}}catch(e){}
    render();
  }
  async function openAdmin(){
    let p=sessionStorage.getItem('yachiyoAdminPassword')||'';
    if(!p)p=prompt('管理者パスワードを入力してください')||'';
    if(!p)return;
    status.textContent='確認中...';
    try{
      const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-admin-password':p},body:JSON.stringify({data:links})});
      if(r.status===401){alert('管理者パスワードが違います。');status.textContent='';return}
      if(!r.ok){alert('管理機能の接続設定を確認してください。');status.textContent='';return}
      sessionStorage.setItem('yachiyoAdminPassword',p);document.body.classList.add('editing');adminBtn.textContent='管理終了';renderEditor();status.textContent='';
    }catch(e){alert('管理機能に接続できませんでした。');status.textContent=''}
  }
  adminBtn.addEventListener('click',()=>{
    if(document.body.classList.contains('editing')){document.body.classList.remove('editing');sessionStorage.removeItem('yachiyoAdminPassword');adminBtn.textContent='管理';adminBtn.style.display='none';load();return}
    openAdmin();
  });
  document.getElementById('linkAdd').addEventListener('click',()=>{links.push({name:'',url:''});renderEditor()});
  editor.addEventListener('input',e=>{if(!e.target.dataset.k)return;links[Number(e.target.dataset.i)][e.target.dataset.k]=e.target.value});
  editor.addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;links.splice(Number(b.dataset.del),1);renderEditor()});
  document.getElementById('linkCancel').addEventListener('click',()=>{document.body.classList.remove('editing');adminBtn.textContent='管理';adminBtn.style.display='none';load()});
  document.getElementById('linkSave').addEventListener('click',async()=>{
    const next=clean(links);if(next.some(x=>!x.name||!safeUrl(x.url))){alert('表示名と正しいURLを入力してください。');return}
    const p=sessionStorage.getItem('yachiyoAdminPassword')||'';status.textContent='保存中...';
    try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-admin-password':p},body:JSON.stringify({data:next})});if(r.status===401){alert('管理者パスワードが違います。');status.textContent='';return}if(!r.ok){alert('保存できませんでした。');status.textContent='';return}links=next;render();renderEditor();status.textContent='保存しました。'}catch(e){alert('保存できませんでした。');status.textContent=''}
  });
  sessionStorage.removeItem('yachiyoAdminPassword');
  let taps=0,timer=null;
  document.addEventListener('pointerup',e=>{if(e.target.closest('#adminBtn'))return;const right=innerWidth-e.clientX,bottom=innerHeight-e.clientY;if(right>130||bottom>130){taps=0;return}taps++;clearTimeout(timer);timer=setTimeout(()=>taps=0,1500);if(taps>=3){taps=0;adminBtn.style.display='block'}},{passive:true});
  load();
})();
</script>
</body>
</html>
