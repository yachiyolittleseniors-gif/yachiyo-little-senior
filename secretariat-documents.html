<!doctype html>
<html lang="ja">
<head>
<style id="initial-paint-style">html{background:#071426}</style>
<meta charset="utf-8">
<meta name="author" content="tatsuki.saitoh">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#071426">
<title>事務局からのお知らせ一覧｜八千代リトルシニア</title>
<style>
:root{--navy:#071426;--gold:#c79a3b;--gold2:#e2bd67;--bg:#f4f3ef;--ink:#17202b;--muted:#69737f}
*{box-sizing:border-box}
html,body{overflow-x:hidden;-webkit-overflow-scrolling:touch}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink)}
a{text-decoration:none;color:inherit}
.header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;border-bottom:1px solid rgba(199,154,59,.5)}
.nav{max-width:900px;min-height:68px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{font-family:serif;font-size:16px;font-weight:700;letter-spacing:.06em}
.back{margin-left:auto;padding:9px 12px;border:1px solid rgba(199,154,59,.6);border-radius:7px;color:var(--gold2);font-size:12px;font-weight:800;white-space:nowrap}
.hero{background:linear-gradient(135deg,var(--navy),#162d47);color:#fff}
.hero-inner{max-width:900px;margin:auto;padding:34px 16px 31px}
.eyebrow{font-size:10px;letter-spacing:.22em;color:var(--gold2)}
h1{margin:8px 0 6px;font-family:serif;font-size:30px;font-weight:500;line-height:1.35;letter-spacing:.05em}
.crumb{font-size:11px;color:#c9d0d9}
.wrap{max-width:760px;margin:auto;padding:24px 14px 60px}
.summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px;padding:0 2px}
.summary h2{margin:0;color:var(--navy);font-size:18px}
.count{padding:5px 11px;border-radius:999px;background:var(--navy);color:var(--gold2);font-size:11px;font-weight:900}
.list{display:grid;gap:12px}
.item{position:relative;padding:17px 15px 15px;border:1px solid #ddd9d0;border-radius:12px;background:#fff;box-shadow:0 8px 24px rgba(7,20,38,.05);overflow:hidden}
.item::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.name{padding-right:4px;color:var(--navy);font-size:14px;font-weight:900;line-height:1.55;overflow-wrap:anywhere}
.meta{margin-top:6px;color:var(--muted);font-size:11px}
.actions{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;margin-top:13px}
.open,.delete{min-height:44px;padding:11px 13px;border-radius:8px;font:inherit;font-size:12px;font-weight:900;text-align:center;cursor:pointer}
.open{border:1px solid var(--gold);background:var(--gold);color:#fff}
.delete{border:1px solid #d6bcbc;background:#fff;color:#9b2727}
.empty,.error{padding:28px 16px;border:1px dashed #d6d2c8;border-radius:11px;background:#fff;color:#7b8490;font-size:13px;line-height:1.7;text-align:center}
.footer{padding:28px 16px;background:var(--navy);color:#9aa5b1;text-align:center;font-size:11px}
.notice{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:50;padding:8px 13px;border:1px solid var(--gold2);border-radius:999px;background:rgba(7,20,38,.96);color:#fff;font-size:12px;font-weight:800;opacity:0;transform:translate(-50%,10px);transition:.2s;pointer-events:none}
.notice.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:480px){h1{font-size:26px}.actions{grid-template-columns:1fr auto}.name{font-size:13px}}
</style>
</head>
<body>
<header class="header">
  <nav class="nav">
    <div class="brand">八千代リトルシニア</div>
    <a class="back" href="./board.html">事務局へ戻る</a>
  </nav>
</header>
<section class="hero">
  <div class="hero-inner">
    <div class="eyebrow">SECRETARIAT DOCUMENTS</div>
    <h1>事務局からのお知らせ一覧</h1>
    <div class="crumb">TEAM PAGE ／ SECRETARIAT</div>
  </div>
</section>
<main class="wrap">
  <div class="summary">
    <h2>保存済み資料</h2>
    <span class="count" id="documentCount">読込中</span>
  </div>
  <div class="list" id="documentList">
    <div class="empty">資料を読み込んでいます。</div>
  </div>
</main>
<footer class="footer">© <span id="year"></span> 八千代リトルシニア</footer>
<div class="notice" id="notice" role="status" aria-live="polite"></div>
<script>
(()=>{
  const API='/.netlify/functions/site-data?section=board-meeting-documents';
  const AUTH_API='/.netlify/functions/site-data?section=access-settings';
  const COACH_AUTH_API='/.netlify/functions/coach-attendance-data';
  const list=document.getElementById('documentList');
  const count=document.getElementById('documentCount');
  const notice=document.getElementById('notice');
  let documents=[];
  let noticeTimer=0;

  document.getElementById('year').textContent=new Date().getFullYear();

  function showNotice(message){
    notice.textContent=message;
    notice.classList.add('show');
    clearTimeout(noticeTimer);
    noticeTimer=setTimeout(()=>notice.classList.remove('show'),1800);
  }

  function formatSize(bytes){
    const value=Number(bytes||0);
    return value>=1024*1024?(value/1024/1024).toFixed(1)+'MB':Math.max(1,Math.round(value/1024))+'KB';
  }

  function formatDate(value){
    const date=new Date(value||'');
    if(Number.isNaN(date.getTime()))return '';
    return date.toLocaleDateString('ja-JP',{year:'numeric',month:'numeric',day:'numeric'});
  }

  async function verifyAccess(password){
    if(!password)return false;
    try{
      const response=await fetch(AUTH_API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'verifyAccessPassword',password})});
      if(response.ok){sessionStorage.setItem('yachiyoAttendancePass',password);return true}
    }catch(error){}
    return false;
  }

  async function requireAccess(){
    const saved=sessionStorage.getItem('yachiyoAttendancePass')||'';
    if(await verifyAccess(saved))return saved;
    const entered=prompt('パスワードを入力してください。');
    if(entered!==null&&await verifyAccess(entered))return entered;
    alert('パスワードが違います。');
    location.replace('./index.html');
    return '';
  }

  async function requireCoachPassword(){
    const entered=prompt('パスワードを入力してください。');
    if(entered===null)return '';
    try{
      const response=await fetch(COACH_AUTH_API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'verifyCoachPassword',password:entered})});
      if(response.ok)return entered;
    }catch(error){}
    alert('パスワードが違います。');
    return '';
  }

  function render(){
    list.replaceChildren();
    count.textContent=documents.length+'件';
    if(!documents.length){
      const empty=document.createElement('div');
      empty.className='empty';
      empty.textContent='現在保存されている資料はありません。';
      list.appendChild(empty);
      return;
    }
    documents.forEach(item=>{
      const row=document.createElement('article');
      row.className='item';
      const name=document.createElement('div');
      name.className='name';
      name.textContent=item.fileName||'事務局資料';
      const meta=document.createElement('div');
      meta.className='meta';
      meta.textContent=[formatDate(item.uploadedAt),formatSize(item.size)].filter(Boolean).join(' ／ ');
      const actions=document.createElement('div');
      actions.className='actions';
      const open=document.createElement('a');
      open.className='open';
      open.href='./secretariat-document-viewer.html?id='+encodeURIComponent(item.id)+'&type='+encodeURIComponent(item.contentType||'application/pdf')+'&v=20260912-9';
      open.textContent='資料を見る';
      const remove=document.createElement('button');
      remove.className='delete';
      remove.type='button';
      remove.textContent='削除';
      remove.addEventListener('click',()=>deleteDocument(item));
      actions.append(open,remove);
      row.append(name,meta,actions);
      list.appendChild(row);
    });
  }

  async function load(){
    const access=await requireAccess();
    if(!access)return;
    document.documentElement.style.visibility='';
    try{
      const response=await fetch(API,{cache:'no-store',headers:{'x-access-password':access}});
      if(!response.ok)throw new Error();
      const body=await response.json();
      documents=Array.isArray(body.data)?body.data:[];
      render();
    }catch(error){
      count.textContent='-';
      list.innerHTML='<div class="error">資料を読み込めませんでした。時間をおいて再度お試しください。</div>';
    }
  }

  async function deleteDocument(item){
    if(!confirm('「'+(item.fileName||'事務局資料')+'」を削除しますか？'))return;
    const coachPassword=await requireCoachPassword();
    if(!coachPassword)return;
    const access=sessionStorage.getItem('yachiyoAttendancePass')||'';
    try{
      const response=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-access-password':access,'x-coach-password':coachPassword},body:JSON.stringify({action:'deleteBoardMeetingDocument',id:item.id})});
      const body=await response.json().catch(()=>({}));
      if(!response.ok)throw new Error(body.error||'資料を削除できませんでした。');
      documents=Array.isArray(body.data)?body.data:documents.filter(entry=>entry.id!==item.id);
      render();
      showNotice('資料を削除しました');
    }catch(error){alert(error.message||'資料を削除できませんでした。')}
  }

  load();
})();
</script>
</body>
</html>
