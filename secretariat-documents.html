<!doctype html>
<html lang="ja">
<head>
<style id="initial-paint-style">html{background:#071426}</style>
<meta charset="utf-8">
<meta name="author" content="tatsuki.saitoh">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#071426">
<title>事務局からのお知らせ一覧｜八千代リトルシニア</title>
<link rel="preload" as="image" href="./official-logo-crisp-final.png">
<style>
:root{--navy:#071426;--gold:#c79a3b;--gold2:#e2bd67;--bg:#f4f3ef;--ink:#17202b;--muted:#69737f;--line:rgba(199,154,59,.38);--fixed-header-height:82px}
*{box-sizing:border-box}
html,body{overflow-x:hidden;-webkit-overflow-scrolling:touch}
body{margin:0;padding-top:var(--fixed-header-height);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink)}
a{text-decoration:none;color:inherit}
.header{position:fixed;top:0;left:0;right:0;z-index:9999;width:100%;background:rgba(7,20,38,.97);color:#fff;border-bottom:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.14);backdrop-filter:blur(12px)}
.nav{max-width:1180px;min-height:82px;margin:auto;display:flex;align-items:center;padding:0 22px;gap:28px}
.brand{display:flex;align-items:center;gap:12px;flex:0 1 620px;min-width:320px}
.official-brand-wrap{display:flex;align-items:center;width:min(620px,52vw);max-width:100%;height:62px}
.official-brand-img{display:block;width:100%;height:100%;max-height:none;object-fit:contain;object-position:left center;background:transparent}
.links{display:flex;align-items:center;gap:22px;margin-left:auto;font-size:13px;white-space:nowrap}
.links a{padding:28px 0}
.menu{display:none;margin-left:auto;position:relative;z-index:10002;min-width:44px;min-height:44px;align-items:center;justify-content:center;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:none;color:#fff;font:inherit;font-size:20px;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.mobile-links{display:none;z-index:10001;background:var(--navy);padding:8px 22px 18px;box-shadow:0 14px 28px rgba(0,0,0,.2)}
.mobile-links a{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1);color:#fff}
.hero{background:linear-gradient(135deg,var(--navy),#162d47);color:#fff}
.hero-inner{max-width:900px;margin:auto;padding:34px 16px 31px}
.eyebrow{font-size:10px;letter-spacing:.22em;color:var(--gold2)}
h1{margin:8px 0 6px;font-family:serif;font-size:30px;font-weight:500;line-height:1.35;letter-spacing:.05em}
.crumb{font-size:11px;color:#c9d0d9}
.wrap{max-width:760px;margin:auto;padding:24px 14px 60px}
.summary{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;margin-bottom:13px;padding:0 2px}
.summary-left{display:flex;align-items:center;gap:8px;min-width:0}
.summary h2{margin:0;color:var(--navy);font-size:18px}
.count{padding:5px 11px;border-radius:999px;background:var(--navy);color:var(--gold2);font-size:11px;font-weight:900}
.summary-back{display:flex;align-items:center;justify-content:center;min-height:36px;padding:8px 11px;border:1px solid var(--gold);border-radius:999px;background:var(--navy);color:var(--gold2);font-size:11px;font-weight:900;white-space:nowrap}
.list{display:grid;gap:12px}
.item{position:relative;padding:17px 15px 15px;border:1px solid #ddd9d0;border-radius:12px;background:#fff;box-shadow:0 8px 24px rgba(7,20,38,.05);overflow:hidden}
.item::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.name{padding-right:4px;color:var(--navy);font-size:14px;font-weight:900;line-height:1.55;overflow-wrap:anywhere}
.meta{margin-top:6px;color:var(--muted);font-size:11px}
.actions{display:grid;grid-template-columns:1fr;gap:9px;margin-top:13px}
.open,.delete{display:flex;align-items:center;justify-content:center;min-height:44px;padding:11px 13px;border-radius:8px;font:inherit;font-size:12px;font-weight:900;line-height:1;text-align:center;cursor:pointer}
.open{border:1px solid var(--gold);background:var(--gold);color:#fff}
.delete{border:1px solid #d6bcbc;background:#fff;color:#9b2727}
.empty,.error{padding:28px 16px;border:1px dashed #d6d2c8;border-radius:11px;background:#fff;color:#7b8490;font-size:13px;line-height:1.7;text-align:center}
.footer{padding:28px 16px;background:var(--navy);color:#9aa5b1;text-align:center;font-size:11px}
.notice{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:50;padding:8px 13px;border:1px solid var(--gold2);border-radius:999px;background:rgba(7,20,38,.96);color:#fff;font-size:12px;font-weight:800;opacity:0;transform:translate(-50%,10px);transition:.2s;pointer-events:none}
.notice.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){
  :root{--fixed-header-height:72px}
  .links{display:none}
  .menu{display:flex!important}
  .nav{min-height:72px;height:auto;padding:8px 14px;gap:10px}
  .brand{min-width:0;flex:1;transform:translateX(10px)}
  .official-brand-wrap{width:min(460px,72vw);height:52px}
  .mobile-links{display:none!important;position:fixed;left:12px;right:12px;top:74px;border:1px solid var(--line);border-radius:14px;max-height:calc(100vh - 92px);overflow-y:auto;padding:8px 16px 12px}
  .mobile-links.show{display:grid!important}
  .mobile-links a{font-size:15px;padding:14px 4px}
}
@media(max-width:600px){
  :root{--fixed-header-height:66px}
  .nav{min-height:64px;padding-left:12px;padding-right:12px}
  .official-brand-wrap{width:min(360px,76vw);height:50px}
  .mobile-links{top:70px;max-height:calc(100vh - 70px)}
}
@media(max-width:480px){h1{font-size:26px}.name{font-size:13px}.summary h2{font-size:16px}.summary-left{gap:6px}.count{padding:5px 9px}.summary-back{padding:8px 9px;font-size:10px}}
</style>
</head>
<body>
<header class="header">
  <nav class="nav" aria-label="メインナビゲーション">
    <div class="brand">
      <a class="official-brand-wrap" href="#" aria-label="ページ先頭へ戻る">
        <img class="official-brand-img" src="./official-logo-crisp-final.png" alt="八千代リトルシニア 公式ロゴ" width="2062" height="374">
      </a>
    </div>
    <div class="links">
      <a href="./index.html">HOME</a><a href="./team.html">チーム紹介</a><a href="./players.html">選手紹介</a><a href="./join.html">選手募集</a><a href="./contact.html">お問い合わせ</a>
    </div>
    <button class="menu" id="siteMenuButton" type="button" aria-label="メニューを開く" aria-controls="mobileLinks" aria-expanded="false">☰</button>
  </nav>
    <div class="mobile-links" id="mobileLinks">
      <a href="./index.html">HOME</a>
      <a href="./team.html">チーム紹介</a>
      <a href="./players.html">選手紹介</a>
      <a href="./results.html">試合結果</a>
      <a href="./schedule.html">スケジュール</a>
      <a href="./join.html">入団案内</a>
      <a href="./contact.html">お問い合わせ</a>
      <a href="./links.html">リンク集</a>
      <a href="./seniorcup.html">八千代リトルシニア杯</a>
      <a href="./terms.html">サイト利用について</a>
      <a href="./board.html?from=documents">チーム専用ページ 🔒</a>
    </div>
</header>
<section class="hero">
  <div class="hero-inner">
    <div class="eyebrow">SECRETARIAT DOCUMENTS</div>
    <h1>事務局からのお知らせ一覧</h1>
    <div class="crumb">TEAM PAGE ／ SECRETARIAT</div>
  </div>
</section>
<main class="wrap">
  <div class="summary">
    <div class="summary-left">
      <h2>保存済み資料</h2>
      <span class="count" id="documentCount">読込中</span>
    </div>
    <a class="summary-back" href="./board.html?from=documents">チーム専用ページへ戻る</a>
  </div>
  <div class="list" id="documentList">
    <div class="empty">資料を読み込んでいます。</div>
  </div>
</main>
<footer class="footer">© <span id="year"></span> 八千代リトルシニア</footer>
<div class="notice" id="notice" role="status" aria-live="polite"></div>
<script>
(()=>{
  const isReferee=new URLSearchParams(location.search).get('department')==='referee';
  const API='/.netlify/functions/site-data?section='+(isReferee?'referee-documents':'board-meeting-documents');
  const AUTH_API='/.netlify/functions/site-data?section=access-settings';
  const COACH_AUTH_API='/.netlify/functions/coach-attendance-data';
  const list=document.getElementById('documentList');
  const count=document.getElementById('documentCount');
  const notice=document.getElementById('notice');
  const menuButton=document.getElementById('siteMenuButton');
  const menu=document.getElementById('mobileLinks');
  let documents=[];
  let noticeTimer=0;

  if(isReferee){
    document.title='審判部からのお知らせ一覧｜八千代リトルシニア';
    document.querySelector('.eyebrow').textContent='UMPIRE DEPARTMENT DOCUMENTS';
    document.querySelector('h1').textContent='審判部からのお知らせ一覧';
    document.querySelector('.crumb').textContent='TEAM PAGE ／ UMPIRE DEPARTMENT';
  }

  document.getElementById('year').textContent=new Date().getFullYear();
  document.querySelector('.official-brand-wrap').addEventListener('click',event=>{
    event.preventDefault();
    window.scrollTo({top:0,behavior:'smooth'});
  });
  menuButton.addEventListener('click',()=>{
    const open=menu.classList.toggle('show');
    menuButton.textContent=open?'✕':'☰';
    menuButton.setAttribute('aria-expanded',String(open));
    menuButton.setAttribute('aria-label',open?'メニューを閉じる':'メニューを開く');
  });
  document.addEventListener('click',event=>{
    if(event.target.closest('.header'))return;
    menu.classList.remove('show');
    menuButton.textContent='☰';
    menuButton.setAttribute('aria-expanded','false');
    menuButton.setAttribute('aria-label','メニューを開く');
  });

  function showNotice(message){
    notice.textContent=message;
    notice.classList.add('show');
    clearTimeout(noticeTimer);
    noticeTimer=setTimeout(()=>notice.classList.remove('show'),1800);
  }

  function formatSize(bytes){
    const value=Number(bytes||0);
    return value>=1024*1024?(value/1024/1024).toFixed(1)+'MB':Math.max(1,Math.round(value/1024))+'KB';
  }

  function formatDate(value){
    const date=new Date(value||'');
    if(Number.isNaN(date.getTime()))return '';
    return date.toLocaleDateString('ja-JP',{year:'numeric',month:'numeric',day:'numeric'});
  }

  async function verifyAccess(password){
    if(!password)return false;
    try{
      const response=await fetch(AUTH_API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'verifyAccessPassword',password})});
      if(response.ok){sessionStorage.setItem('yachiyoAttendancePass',password);return true}
    }catch(error){}
    return false;
  }

  async function requireAccess(){
    const saved=sessionStorage.getItem('yachiyoAttendancePass')||'';
    if(await verifyAccess(saved))return saved;
    const entered=prompt('パスワードを入力してください。');
    if(entered!==null&&await verifyAccess(entered))return entered;
    alert('パスワードが違います。');
    location.replace('./index.html');
    return '';
  }

  async function requireCoachPassword(){
    const entered=prompt('パスワードを入力してください。');
    if(entered===null)return '';
    try{
      const response=await fetch(COACH_AUTH_API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'verifyCoachPassword',password:entered})});
      if(response.ok)return entered;
    }catch(error){}
    alert('パスワードが違います。');
    return '';
  }

  function render(){
    list.replaceChildren();
    count.textContent=documents.length+'件';
    if(!documents.length){
      const empty=document.createElement('div');
      empty.className='empty';
      empty.textContent='現在保存されている資料はありません。';
      list.appendChild(empty);
      return;
    }
    documents.forEach(item=>{
      const row=document.createElement('article');
      row.className='item';
      const name=document.createElement('div');
      name.className='name';
      name.textContent=item.fileName||(isReferee?'審判部資料':'事務局資料');
      const meta=document.createElement('div');
      meta.className='meta';
      meta.textContent=[formatDate(item.uploadedAt),formatSize(item.size)].filter(Boolean).join(' ／ ');
      const actions=document.createElement('div');
      actions.className='actions';
      const open=document.createElement('a');
      open.className='open';
      open.href='./secretariat-document-viewer.html?id='+encodeURIComponent(item.id)+'&type='+encodeURIComponent(item.contentType||'application/pdf')+(isReferee?'&department=referee':'')+'&v=20260912-15';
      open.textContent='資料を見る';
      actions.append(open);
      row.append(name,meta,actions);
      list.appendChild(row);
    });
  }

  async function load(){
    const access=await requireAccess();
    if(!access)return;
    document.documentElement.style.visibility='';
    try{
      const response=await fetch(API,{cache:'no-store',headers:{'x-access-password':access}});
      if(!response.ok)throw new Error();
      const body=await response.json();
      documents=Array.isArray(body.data)?body.data:[];
      render();
    }catch(error){
      count.textContent='-';
      list.innerHTML='<div class="error">資料を読み込めませんでした。時間をおいて再度お試しください。</div>';
    }
  }

  async function deleteDocument(item){
    if(!confirm('「'+(item.fileName||(isReferee?'審判部資料':'事務局資料'))+'」を削除しますか？'))return;
    const coachPassword=await requireCoachPassword();
    if(!coachPassword)return;
    const access=sessionStorage.getItem('yachiyoAttendancePass')||'';
    try{
      const response=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-access-password':access,'x-coach-password':coachPassword},body:JSON.stringify({action:isReferee?'deleteRefereeDocument':'deleteBoardMeetingDocument',id:item.id})});
      const body=await response.json().catch(()=>({}));
      if(!response.ok)throw new Error(body.error||'資料を削除できませんでした。');
      documents=Array.isArray(body.data)?body.data:documents.filter(entry=>entry.id!==item.id);
      render();
      showNotice('資料を削除しました');
    }catch(error){alert(error.message||'資料を削除できませんでした。')}
  }

  load();
})();
</script>
</body>
</html>
